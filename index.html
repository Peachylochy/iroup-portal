<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal IR Workspace</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f4f7fb;
      font-family:Segoe UI,sans-serif;
      color:#1e293b;
    }

    .portal{
      text-align:center;
      padding:40px;
      background:white;
      border-radius:24px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      width:min(90%,500px);
    }

    h1{
      margin-bottom:10px;
    }

    p{
      color:#64748b;
      margin-bottom:30px;
    }

    .links{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    a{
      text-decoration:none;
      padding:14px 18px;
      border-radius:14px;
      background:#2563eb;
      color:white;
      font-weight:600;
      transition:.2s ease;
    }

    a:hover{
      transform:translateY(-2px);
      opacity:.95;
    }

    a:focus-visible{
      outline:3px solid #93c5fd;
      outline-offset:3px;
    }
  </style>
</head>

<body>
  <div class="portal">
    <h1>Personal IR Workspace</h1>
    <p>Select a module to continue</p>

    <div class="links">
      <a href="./Team%20IROUP/index.html">
        Open Team IROUP
      </a>

      <a href="./peach-workload-portfolio/frontend/index.html">
        Open Peach Workload Portfolio
      </a>
    </div>
  </div>
</body>
</html>
