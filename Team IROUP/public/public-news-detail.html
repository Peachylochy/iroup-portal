<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข่าวสาร | iROUP</title>
<script>
(function(){
  var theme = localStorage.getItem('iroup_public_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<link rel="stylesheet" href="../css/iroup-theme.css">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07111f;--surface:#0c1b2d;--surface-2:#10243a;--surface-3:#132b46;
  --line:rgba(100,190,255,.16);--line-strong:rgba(96,165,250,.28);
  --text:#eef7ff;--muted:#8ba7c2;--soft:#c7d8ec;--dim:#5f7898;
  --blue:#2387ff;--cyan:#2bd8ff;--violet:#8b5cf6;--gold:#f7b733;--green:#5ee38c;--red:#ff6b6b;
  --shadow:0 24px 70px rgba(0,0,0,.28);--radius:18px;--hero:url("../assets/news-hero-dark.webp");
}
:root[data-theme="light"]{
  --bg:#f4f9fd;--surface:#ffffff;--surface-2:#f6fbff;--surface-3:#eaf4ff;
  --line:rgba(19,74,124,.12);--line-strong:rgba(26,109,181,.22);
  --text:#0b2340;--muted:#63758c;--soft:#344b66;--dim:#8495a8;
  --blue:#176fe8;--cyan:#22aee8;--violet:#7c3aed;--gold:#d69014;--green:#2eaa56;--red:#df4b4b;
  --shadow:0 18px 50px rgba(34,71,108,.13);--hero:url("../assets/news-hero-light.webp");
}
html{scroll-behavior:smooth}
body{min-height:100vh;background:
  radial-gradient(circle at 16% 5%,rgba(35,135,255,.18),transparent 32%),
  radial-gradient(circle at 85% 6%,rgba(139,92,246,.14),transparent 28%),
  var(--bg);color:var(--text);font-family:'Prompt',sans-serif}
:root[data-theme="light"] body{background:linear-gradient(180deg,#f7fbff 0,#eef6fd 42%,#fbfdff 100%)}
a{color:inherit;text-decoration:none}button{font:inherit}
.topbar{position:sticky;top:0;z-index:50;height:64px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;gap:22px;background:rgba(7,17,31,.8);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
:root[data-theme="light"] .topbar{background:rgba(255,255,255,.86)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand img{height:32px;width:auto;display:block}.brand-fallback{display:none;color:var(--text);font-weight:900}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nav a,.theme-toggle,.lang-btn{border:1px solid transparent;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;color:var(--soft);background:transparent;cursor:pointer}
.nav a:hover,.nav a.active{background:rgba(35,135,255,.14);border-color:rgba(35,135,255,.28);color:var(--text)}
.lang{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:3px}
:root[data-theme="light"] .lang{background:#fff}
.lang-btn{padding:6px 10px}.lang-btn.active{background:var(--blue);color:#fff}
.theme-toggle{background:rgba(255,255,255,.06);border-color:var(--line);min-width:58px}:root[data-theme="light"] .theme-toggle{background:#fff}
.admin-link{background:rgba(255,255,255,.06)!important;border-color:var(--line)!important}
.loading,.error-state{width:min(940px,90%);margin:48px auto;text-align:center;padding:42px 18px;color:var(--muted);font-family:'Sarabun',sans-serif;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.spinner{width:30px;height:30px;border-radius:50%;border:4px solid rgba(35,135,255,.16);border-top-color:var(--blue);animation:spin 1s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
.article-shell{display:none}
.hero{position:relative;overflow:hidden;padding:34px 5% 0;background-image:linear-gradient(90deg,rgba(7,17,31,.98) 0%,rgba(7,17,31,.72) 42%,rgba(7,17,31,.04) 82%),var(--hero);background-size:cover;background-position:center right;border-bottom:1px solid var(--line)}
:root[data-theme="light"] .hero{background-image:linear-gradient(90deg,rgba(247,251,255,.98) 0%,rgba(247,251,255,.78) 42%,rgba(247,251,255,.04) 82%),var(--hero)}
.hero-inner{width:min(1080px,90%);margin:0 auto;padding:12px 0 26px}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-size:13px;font-weight:900;margin-bottom:20px}
.badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:900;font-family:'Sarabun',sans-serif}
.badge.category{background:rgba(94,227,140,.13);color:var(--green)}.badge.sdg{background:rgba(247,183,51,.13);color:var(--gold)}
h1{font-size:clamp(30px,4.6vw,56px);line-height:1.18;font-weight:900;letter-spacing:0;color:var(--text);max-width:840px}
.meta{margin-top:14px;color:var(--muted);font-size:13px;font-family:'Sarabun',sans-serif}
.cover{width:min(1080px,90%);margin:8px auto -52px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,rgba(35,135,255,.14),rgba(43,216,255,.08)),var(--surface-3);box-shadow:var(--shadow);aspect-ratio:16/8;display:grid;place-items:center;color:var(--blue);font-size:48px;font-weight:900;border:1px solid var(--line)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.main{width:min(1080px,90%);margin:0 auto;padding:86px 0 58px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}
.article-card,.side-card{background:rgba(12,27,45,.86);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 46px rgba(0,0,0,.12)}
:root[data-theme="light"] .article-card,:root[data-theme="light"] .side-card{background:rgba(255,255,255,.94)}
.article-card{padding:30px}.content{font-family:'Sarabun',sans-serif;font-size:17px;line-height:2;color:var(--soft);white-space:pre-wrap}
:root[data-theme="light"] .content{color:#223a58}
.side-card{position:sticky;top:84px;padding:16px}.side-title{font-size:15px;font-weight:900;margin-bottom:12px}
.action-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--text);font-weight:900;margin-top:9px;cursor:pointer}
.action-btn.primary{background:linear-gradient(135deg,var(--blue),var(--violet));border-color:transparent;color:#fff}.action-btn.green{background:rgba(94,227,140,.13);color:var(--green)}
.gallery-section{margin-top:26px}.section-title{font-size:20px;font-weight:900;margin-bottom:13px}.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{height:112px;border:0;border-radius:12px;overflow:hidden;background:var(--surface-3);cursor:pointer;padding:0;box-shadow:0 12px 30px rgba(0,0,0,.1)}.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.gallery-modal{position:fixed;inset:0;background:rgba(3,12,24,.9);z-index:100;display:none;align-items:center;justify-content:center;padding:22px}.gallery-modal.open{display:flex}
.gallery-panel{width:min(1120px,100%);display:grid;grid-template-columns:48px 1fr 48px;gap:12px;align-items:center}.gallery-stage{background:#050b16;border-radius:16px;min-height:300px;max-height:78vh;display:grid;place-items:center;overflow:hidden;box-shadow:var(--shadow)}
.gallery-stage img{max-width:100%;max-height:78vh;object-fit:contain;display:block}.gallery-nav,.gallery-close{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;font-weight:900;cursor:pointer}
.gallery-nav{width:48px;height:48px;font-size:28px}.gallery-close{position:absolute;top:16px;right:16px;width:42px;height:42px;font-size:24px}.gallery-caption{position:absolute;left:24px;right:24px;bottom:14px;text-align:center;color:rgba(255,255,255,.76);font-family:'Sarabun',sans-serif;font-size:13px}
footer{border-top:1px solid var(--line);padding:24px 5%;text-align:center;color:var(--dim);font-family:'Sarabun',sans-serif;font-size:12px}
@media(max-width:960px){.topbar{height:auto;min-height:64px;align-items:flex-start;padding-top:12px;padding-bottom:12px}.nav{max-width:100%;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start}.layout{grid-template-columns:1fr}.side-card{position:static}.article-card{padding:22px}.cover{aspect-ratio:4/3}.gallery-panel{grid-template-columns:38px 1fr 38px}.gallery-nav{width:38px;height:38px}}
@media(max-width:640px){.hero{padding-left:0;padding-right:0}.hero-inner,.cover,.main{width:92%}.content{font-size:16px}.image-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="public-landing.html"><img src="../assets/iroup-logo.png" alt="iROUP" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="brand-fallback">iROUP</span></a>
  <nav class="nav" aria-label="Public navigation">
    <a class="active" href="public-news.html" data-i18n="navNews">ข่าวสาร</a>
    <a href="public-knowledge.html" data-i18n="navKnowledge">คลังความรู้</a>
    <a href="public-scholar.html" data-i18n="navScholar">ทุนการศึกษา</a>
    <a href="public-events.html" data-i18n="navEvents">กิจกรรม</a>
    <a href="public-mou.html">MOU</a>
    <a href="public-mobility.html">Mobility</a>
    <span class="lang"><button class="lang-btn active" type="button" data-lang="TH" onclick="setLang('TH')">TH</button><button class="lang-btn" type="button" data-lang="EN" onclick="setLang('EN')">EN</button></span>
    <button class="theme-toggle" type="button" id="themeToggle" onclick="toggleTheme()">Dark</button>
    <a class="admin-link" href="../index.html" data-i18n="admin">Admin</a>
  </nav>
</header>

<div id="loadingState" class="loading"><div class="spinner"></div><span data-i18n="loading">กำลังโหลดข่าว...</span></div>
<div id="errorState" class="error-state" style="display:none"></div>

<article id="articleShell" class="article-shell">
  <section class="hero">
    <div class="hero-inner">
      <a class="back-link" href="public-news.html" data-i18n="back">← กลับไปหน้าข่าว</a>
      <div id="badgeRow" class="badges"></div>
      <h1 id="articleTitle"></h1>
      <div id="articleMeta" class="meta"></div>
    </div>
    <div id="heroCover" class="cover">NEWS</div>
  </section>

  <main class="main">
    <div class="layout">
      <section class="article-card">
        <div id="articleContent" class="content"></div>
      </section>
      <aside class="side-card">
        <div class="side-title" data-i18n="actions">การดำเนินการ</div>
        <a class="action-btn primary" href="public-news.html" data-i18n="backShort">กลับไปหน้าข่าว</a>
        <a id="externalLinkBtn" class="action-btn" href="#" target="_blank" rel="noopener" style="display:none" data-i18n="external">เปิดลิงก์เพิ่มเติม</a>
        <button id="galleryBtn" class="action-btn green" type="button" onclick="openGallery(0)" style="display:none" data-i18n="images">รูปภาพ</button>
      </aside>
    </div>
    <section id="gallerySection" class="gallery-section" style="display:none">
      <h2 class="section-title" data-i18n="moreImages">รูปภาพเพิ่มเติม</h2>
      <div id="imageGrid" class="image-grid"></div>
    </section>
  </main>
</article>

<div id="galleryModal" class="gallery-modal" aria-hidden="true">
  <button class="gallery-close" type="button" onclick="closeGallery()" aria-label="Close">&times;</button>
  <div class="gallery-panel">
    <button class="gallery-nav" type="button" onclick="moveGallery(-1)" aria-label="Previous">&lsaquo;</button>
    <div class="gallery-stage"><img id="galleryImage" src="" alt=""></div>
    <button class="gallery-nav" type="button" onclick="moveGallery(1)" aria-label="Next">&rsaquo;</button>
  </div>
  <div id="galleryCaption" class="gallery-caption"></div>
</div>

<footer>© 2569 International Relations Office - University of Phayao</footer>

<script src="../js/iroup-config.js"></script>
<script src="../js/iroup-v2-endpoint.js"></script>
<script src="../js/iroup-v2-api.js"></script>
<script>
var currentLang = normalizeLang(localStorage.getItem('iroup_public_lang') || 'TH');
var currentItem = null;
var galleryImages = [];
var galleryIndex = 0;

var I18N = {
  TH: {navNews:'ข่าวสาร',navKnowledge:'คลังความรู้',navScholar:'ทุนการศึกษา',navEvents:'กิจกรรม',admin:'Admin',loading:'กำลังโหลดข่าว...',back:'← กลับไปหน้าข่าว',backShort:'กลับไปหน้าข่าว',actions:'การดำเนินการ',external:'เปิดลิงก์เพิ่มเติม',images:'รูปภาพ',moreImages:'รูปภาพเพิ่มเติม',missingId:'ไม่พบรหัสข่าว',notFound:'ไม่พบข่าว หรือข่าวนี้ไม่ได้เปิดเผยสาธารณะ'},
  EN: {navNews:'News',navKnowledge:'Knowledge',navScholar:'Scholarships',navEvents:'Events',admin:'Admin',loading:'Loading news...',back:'← Back to news',backShort:'Back to news',actions:'Actions',external:'Open external link',images:'Images',moreImages:'More images',missingId:'News ID was not found.',notFound:'News was not found or is not public.'}
};

document.addEventListener('DOMContentLoaded', function(){
  applyLanguage(false);
  applyTheme();
  loadDetail();
});

async function loadDetail(){
  var id = new URLSearchParams(window.location.search).get('id') || '';
  if(!id) return showError(t('missingId'));
  try{
    var response = await IROUP_V2.public.newsList();
    if(!response || !response.success) throw new Error(response && response.error ? response.error : 'V2 public news API error');
    var rows = normalizeList(response).map(normalizeNews);
    currentItem = rows.find(function(item){ return String(item.id) === String(id); });
    if(!currentItem) return showError(t('notFound'));
    renderDetail();
  }catch(error){
    showError(error.message || String(error));
  }
}

function normalizeList(res){
  var data = res && typeof res.data !== 'undefined' ? res.data : res;
  if(Array.isArray(data)) return data;
  var keys = ['rows','records','items','news'];
  for(var i=0;i<keys.length;i++){ if(data && Array.isArray(data[keys[i]])) return data[keys[i]]; }
  return [];
}

function normalizeNews(row){
  var files = collectFiles(row).filter(isPublicFile);
  var cover = safeUrl(row.cover_url || row.cover_image_url || row.thumbnail_url) || firstFileUrl(files, 'cover') || firstFileUrl(files, 'image');
  return {
    id: clean(row.news_id || row.id),
    title_th: clean(row.title_th || row.title || row.name_th),
    title_en: clean(row.title_en || row.name_en),
    content_th: clean(row.content_th || row.content || row.summary_th || row.description_th),
    content_en: clean(row.content_en || row.summary_en || row.description_en),
    publish_date: normalizeDate(row.publish_date || row.published_at || row.created_at),
    category: clean(row.category || row.news_category || row.type),
    sdg_tags: clean(row.sdg_tags || row.sdg || row.tags),
    link_url: safeUrl(row.link_url || row.url),
    cover_url: cover,
    files: files
  };
}

function renderDetail(){
  var item = currentItem;
  var title = displayTitle(item) || '-';
  document.title = title + ' | iROUP';
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('articleShell').style.display = 'block';
  document.getElementById('articleTitle').textContent = title;
  document.getElementById('articleMeta').textContent = formatDate(item.publish_date);
  document.getElementById('articleContent').textContent = displayContent(item) || '-';
  document.getElementById('badgeRow').innerHTML = (item.category ? '<span class="badge category">' + esc(item.category) + '</span>' : '') + renderSdgBadges(item.sdg_tags);
  document.getElementById('heroCover').innerHTML = item.cover_url ? '<img src="' + escAttr(toImageUrl(item.cover_url, 1600)) + '" alt="' + escAttr(title) + '">' : 'NEWS';
  var link = document.getElementById('externalLinkBtn');
  if(item.link_url){ link.href = item.link_url; link.style.display = ''; } else { link.style.display = 'none'; }
  galleryImages = getImageUrls(item);
  renderGallerySection();
}

function renderGallerySection(){
  var section = document.getElementById('gallerySection');
  var grid = document.getElementById('imageGrid');
  var button = document.getElementById('galleryBtn');
  if(!galleryImages.length){ section.style.display = 'none'; button.style.display = 'none'; return; }
  button.style.display = '';
  section.style.display = '';
  grid.innerHTML = galleryImages.map(function(url, index){
    return '<button class="thumb" type="button" onclick="openGallery(' + index + ')"><img src="' + escAttr(toImageUrl(url, 700)) + '" alt=""></button>';
  }).join('');
}

function getImageUrls(item){
  return (item.files || []).filter(function(file){ return clean(file.file_role_id || file.role).toLowerCase() === 'image'; })
    .map(function(file){ return safeUrl(file.file_url || file.thumbnail_url || file.url || file.drive_url); }).filter(Boolean);
}

function setLang(lang){
  currentLang = normalizeLang(lang);
  localStorage.setItem('iroup_public_lang', currentLang);
  applyLanguage(true);
}

function applyLanguage(rerender){
  document.documentElement.lang = currentLang === 'EN' ? 'en' : 'th';
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('.lang-btn').forEach(function(btn){ btn.classList.toggle('active', btn.dataset.lang === currentLang); });
  if(rerender && currentItem) renderDetail();
}

function applyTheme(){
  var theme = document.documentElement.getAttribute('data-theme') || 'dark';
  document.getElementById('themeToggle').textContent = theme === 'light' ? 'Light' : 'Dark';
}

function toggleTheme(){
  var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('iroup_public_theme', next);
  applyTheme();
}

function openGallery(startIndex){
  if(!galleryImages.length) return;
  galleryIndex = Math.max(0, Math.min(Number(startIndex) || 0, galleryImages.length - 1));
  renderGallery();
  var modal = document.getElementById('galleryModal');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
}

function closeGallery(){
  var modal = document.getElementById('galleryModal');
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
}

function moveGallery(delta){
  if(!galleryImages.length) return;
  galleryIndex = (galleryIndex + delta + galleryImages.length) % galleryImages.length;
  renderGallery();
}

function renderGallery(){
  var url = galleryImages[galleryIndex] || '';
  document.getElementById('galleryImage').src = toImageUrl(url, 1600);
  document.getElementById('galleryCaption').textContent = (galleryIndex + 1) + ' / ' + galleryImages.length;
}

document.addEventListener('keydown', function(event){
  var open = document.getElementById('galleryModal').classList.contains('open');
  if(event.key === 'Escape' && open) closeGallery();
  if(!open) return;
  if(event.key === 'ArrowLeft') moveGallery(-1);
  if(event.key === 'ArrowRight') moveGallery(1);
});

function showError(message){
  document.getElementById('loadingState').style.display = 'none';
  var error = document.getElementById('errorState');
  error.style.display = '';
  error.innerHTML = esc(message) + '<br><br><a class="action-btn primary" href="public-news.html" style="max-width:220px;margin:12px auto 0">' + esc(t('backShort')) + '</a>';
}

function displayTitle(item){ return currentLang === 'EN' ? item.title_en || item.title_th : item.title_th || item.title_en; }
function displayContent(item){ return currentLang === 'EN' ? item.content_en || item.content_th : item.content_th || item.content_en; }
function renderSdgBadges(value){ return parseTags(value).slice(0,4).map(function(tag){ return '<span class="badge sdg">SDG ' + esc(tag) + '</span>'; }).join(''); }

function collectFiles(row){
  var groups = [];
  if(Array.isArray(row.files)) groups.push(row.files);
  if(row.files && typeof row.files === 'object' && !Array.isArray(row.files)){
    Object.keys(row.files).forEach(function(key){ if(Array.isArray(row.files[key])) groups.push(row.files[key]); });
  }
  if(Array.isArray(row.public_files)) groups.push(row.public_files);
  if(row.file_summary && Array.isArray(row.file_summary.files)) groups.push(row.file_summary.files);
  return groups.reduce(function(acc, group){ return acc.concat(group); }, []).filter(Boolean);
}

function isPublicFile(file){ var visibility = clean(file && file.visibility_level); return !visibility || visibility === 'public'; }
function firstFileUrl(files, role){ var match = (files || []).find(function(file){ return clean(file.file_role_id || file.role).toLowerCase() === role; }); return match ? safeUrl(match.file_url || match.thumbnail_url || match.url || match.drive_url) : ''; }
function toImageUrl(url, size){ var value = safeUrl(url); var match = value.match(/\/file\/d\/([^/]+)/) || value.match(/[?&]id=([^&]+)/); if(match && match[1]) return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(match[1]) + '&sz=w' + (size || 1200); return value; }
function parseTags(value){ return clean(value).split(/[,|]/).map(function(item){ return clean(item).replace(/^SDG[-\s]*/i,''); }).filter(Boolean); }
function normalizeDate(value){ var text = clean(value); if(!text) return ''; if(/^\d{4}-\d{2}-\d{2}$/.test(text)) return text; var date = new Date(text); if(isNaN(date.getTime())) return text; return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0'); }
function formatDate(value){ var date = new Date(value); if(!value || isNaN(date.getTime())) return '-'; return date.toLocaleDateString(currentLang === 'EN' ? 'en-US' : 'th-TH', { year:'numeric', month:'long', day:'numeric' }); }
function normalizeLang(lang){ return String(lang || '').toUpperCase() === 'EN' ? 'EN' : 'TH'; }
function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.TH[key] || key; }
function clean(value){ return String(value === null || value === undefined ? '' : value).trim(); }
function safeUrl(value){ var text = clean(value); return (!text || text === '-' || text.toLowerCase() === 'undefined' || text.toLowerCase() === 'null') ? '' : text; }
function esc(value){ return clean(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escAttr(value){ return esc(value); }
</script>
