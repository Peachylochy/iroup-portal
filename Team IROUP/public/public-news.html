<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07111f;--surface:#0c1b2d;--surface-2:#10243a;--surface-3:#132b46;
  --line:rgba(100,190,255,.16);--line-strong:rgba(96,165,250,.28);
  --text:#eef7ff;--muted:#8ba7c2;--soft:#c7d8ec;--dim:#5f7898;
  --blue:#2387ff;--cyan:#2bd8ff;--violet:#8b5cf6;--gold:#f7b733;--green:#5ee38c;--red:#ff6b6b;
  --shadow:0 24px 70px rgba(0,0,0,.28);--radius:18px;--hero:url("../assets/news-hero-dark.webp");
}
:root[data-theme="light"]{
  --bg:#f4f9fd;--surface:#ffffff;--surface-2:#f6fbff;--surface-3:#eaf4ff;
  --line:rgba(19,74,124,.12);--line-strong:rgba(26,109,181,.22);
  --text:#0b2340;--muted:#63758c;--soft:#344b66;--dim:#8495a8;
  --blue:#176fe8;--cyan:#22aee8;--violet:#7c3aed;--gold:#d69014;--green:#2eaa56;--red:#df4b4b;
  --shadow:0 18px 50px rgba(34,71,108,.13);--hero:url("../assets/news-hero-light.webp");
}
html{scroll-behavior:smooth}
body{min-height:100vh;background:
  radial-gradient(circle at 16% 5%,rgba(35,135,255,.18),transparent 32%),
  radial-gradient(circle at 85% 6%,rgba(139,92,246,.14),transparent 28%),
  var(--bg);color:var(--text);font-family:'Prompt',sans-serif}
:root[data-theme="light"] body{background:linear-gradient(180deg,#f7fbff 0,#eef6fd 42%,#fbfdff 100%)}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
.topbar{position:sticky;top:0;z-index:50;height:64px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;gap:22px;background:rgba(7,17,31,.8);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
:root[data-theme="light"] .topbar{background:rgba(255,255,255,.86)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.2px}
.brand img{height:44px;max-width:132px;width:auto;object-fit:contain;display:block}.brand-fallback{display:none;color:var(--text);font-weight:900}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nav a,.theme-toggle,.lang-btn{border:1px solid transparent;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;color:var(--soft);background:transparent;cursor:pointer}
.nav a:hover,.nav a.active{background:rgba(35,135,255,.14);border-color:rgba(35,135,255,.28);color:var(--text)}
.lang{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:3px}
:root[data-theme="light"] .lang{background:#fff}
.lang-btn{padding:6px 10px}.lang-btn.active{background:var(--blue);color:#fff}
.theme-toggle{background:rgba(255,255,255,.06);border-color:var(--line);min-width:58px}
:root[data-theme="light"] .theme-toggle{background:#fff}
.admin-link{background:rgba(255,255,255,.06)!important;border-color:var(--line)!important}
.hero{position:relative;overflow:hidden;min-height:300px;padding:54px 5% 44px;background-image:linear-gradient(90deg,rgba(7,17,31,.98) 0%,rgba(7,17,31,.72) 36%,rgba(7,17,31,.04) 78%),var(--hero);background-size:cover;background-position:center right;border-bottom:1px solid var(--line)}
:root[data-theme="light"] .hero{background-image:linear-gradient(90deg,rgba(247,251,255,.98) 0%,rgba(247,251,255,.76) 36%,rgba(247,251,255,.04) 78%),var(--hero)}
.hero-inner{position:relative;z-index:1;width:min(1440px,90%);margin:0 auto}
.hero-kicker{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--violet),var(--blue));box-shadow:0 16px 34px rgba(35,135,255,.24);font-size:26px;margin-bottom:18px}
.hero h1{font-size:clamp(34px,4vw,58px);line-height:1.08;font-weight:900;letter-spacing:0;color:var(--text);max-width:710px}
.lead{margin-top:10px;color:var(--muted);font-family:'Sarabun',sans-serif;font-size:16px;max-width:700px;line-height:1.65}
.hero-kpis{display:flex;gap:48px;margin-top:28px;flex-wrap:wrap}
.kpi-num{font-size:38px;line-height:1;font-weight:900;letter-spacing:0}.kpi-num.total{color:var(--blue)}.kpi-num.cat{color:var(--green)}.kpi-num.month{color:var(--gold)}
.kpi-label{font-size:12px;color:var(--muted);font-weight:800;margin-top:8px;font-family:'Sarabun',sans-serif}
.shell{width:min(1440px,90%);margin:0 auto;padding:28px 0 58px}
.filter-bar{display:grid;grid-template-columns:minmax(280px,1fr) minmax(180px,240px) minmax(160px,220px) auto;gap:10px;align-items:center;background:rgba(12,27,45,.8);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:26px}
:root[data-theme="light"] .filter-bar{background:rgba(255,255,255,.92)}
.search-wrap{position:relative}.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--blue);font-size:15px;line-height:1}
.input,.select{width:100%;height:44px;border:1px solid var(--line);background:rgba(0,0,0,.14);color:var(--text);border-radius:13px;padding:0 13px;outline:none}
.input{padding-left:40px}:root[data-theme="light"] .input,:root[data-theme="light"] .select{background:#fff}
.select option{color:#0b2340;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:13px;padding:0 16px;font-weight:900;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--violet));border-color:transparent;color:#fff}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:2px 0 16px}
.section-title{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:900}.section-count{color:var(--muted);font-size:13px;font-family:'Sarabun',sans-serif}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 46px rgba(0,0,0,.12);min-height:374px;display:flex;flex-direction:column;transition:.2s ease}
.card:hover{transform:translateY(-4px);border-color:var(--line-strong);box-shadow:var(--shadow)}
.cover{height:142px;background:linear-gradient(135deg,rgba(35,135,255,.14),rgba(43,216,255,.08)),var(--surface-3);display:grid;place-items:center;color:var(--blue);font-size:30px;font-weight:900;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.more{position:absolute;top:12px;right:12px;width:32px;height:26px;border-radius:999px;background:rgba(7,17,31,.58);color:#fff;display:grid;place-items:center;font-weight:900;border:1px solid rgba(255,255,255,.14)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900;font-family:'Sarabun',sans-serif}
.badge.category{background:rgba(94,227,140,.13);color:var(--green)}.badge.sdg{background:color-mix(in srgb,var(--sdg-color,var(--gold)) 18%,transparent);color:#fff;border:1px solid color-mix(in srgb,var(--sdg-color,var(--gold)) 55%,transparent)}
.sdg-badge{gap:6px;padding:3px 8px 3px 4px}.sdg-icon-img{width:24px;height:24px;border-radius:5px;object-fit:cover;display:block}.sdg-badge-label{line-height:1}
.title{font-size:16px;font-weight:900;line-height:1.45;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.excerpt{font-family:'Sarabun',sans-serif;color:var(--muted);font-size:13.5px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.footer-row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-family:'Sarabun',sans-serif;font-size:12.5px}
.read-more{color:var(--blue);font-weight:900;white-space:nowrap}
.file-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}.file-chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900;background:rgba(35,135,255,.12);color:var(--cyan);font-family:'Sarabun',sans-serif}
.state{padding:44px 18px;text-align:center;color:var(--muted);font-family:'Sarabun',sans-serif;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);grid-column:1/-1}
.spinner{width:30px;height:30px;border-radius:50%;border:4px solid rgba(35,135,255,.16);border-top-color:var(--blue);animation:spin 1s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
.pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}.page-info{font-family:'Sarabun',sans-serif;color:var(--muted);font-size:12px;margin-right:4px}
.page-btn{border:1px solid var(--line);background:var(--surface);color:var(--soft);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900;cursor:pointer}.page-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}.page-btn:disabled{opacity:.45;cursor:not-allowed}
footer{border-top:1px solid var(--line);padding:24px 5%;text-align:center;color:var(--dim);font-family:'Sarabun',sans-serif;font-size:12px}
@media(max-width:980px){.topbar{height:auto;min-height:64px;align-items:flex-start;padding-top:12px;padding-bottom:12px}.nav{max-width:100%;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start}.filter-bar{grid-template-columns:1fr}.hero-inner,.shell{width:92%}.hero-kpis{gap:28px}.section-head{align-items:flex-start;flex-direction:column}}
@media(max-width:640px){.hero{padding:34px 4%}.hero-kicker{width:46px;height:46px}.cards{grid-template-columns:1fr}.cover{height:162px}.nav{width:100%}}
</style>
</head>

<main class="shell">

<script src="../js/iroup-config.js"></script>
<script src="../js/iroup-v2-endpoint.js"></script>
<script src="../js/iroup-v2-api.js"></script>
<script>
var PAGE_SIZE = 10;
var allNews = [];
var currentPage = 1;
var currentLang = normalizeLang(localStorage.getItem('iroup_public_lang') || 'TH');

var I18N = {
  TH: {
    navNews:'ข่าวสาร',navKnowledge:'คลังความรู้',navScholar:'ทุนการศึกษา',navEvents:'กิจกรรม',admin:'Admin',
    heroTitle:'ข่าวประชาสัมพันธ์',heroLead:'ข่าวสาร ความเคลื่อนไหว และกิจกรรมจากงานวิเทศสัมพันธ์ มหาวิทยาลัยพะเยา',
    kpiTotal:'ข่าวทั้งหมด',kpiCategories:'หมวดหมู่',kpiMonth:'เผยแพร่เดือนนี้',
    searchPlaceholder:'ค้นหาหัวข้อ/เนื้อหา/วันที่...',allCategories:'ทุกหมวดหมู่',allSdg:'ทุก SDG',clearFilters:'ล้างตัวกรอง',
    allNews:'ข่าวทั้งหมด',loading:'กำลังโหลดข่าว...',noData:'ไม่พบข่าวตามเงื่อนไขที่เลือก',loadFail:'ไม่สามารถโหลดข่าวได้',
    items:'รายการ',page:'หน้า',prev:'ก่อนหน้า',next:'ถัดไป',readMore:'อ่านต่อ',newsFallback:'NEWS',thisMonth:'เดือนนี้'
  },
  EN: {
    navNews:'News',navKnowledge:'Knowledge',navScholar:'Scholarships',navEvents:'Events',admin:'Admin',
    heroTitle:'News',heroLead:'Updates, announcements, and activities from the International Relations Office, University of Phayao.',
    kpiTotal:'Total News',kpiCategories:'Categories',kpiMonth:'Published This Month',
    searchPlaceholder:'Search title/content/date...',allCategories:'All categories',allSdg:'All SDGs',clearFilters:'Clear filters',
    allNews:'All News',loading:'Loading news...',noData:'No news matches the selected filters.',loadFail:'Unable to load news',
    items:'items',page:'Page',prev:'Previous',next:'Next',readMore:'Read more',newsFallback:'NEWS',thisMonth:'this month'
  }
};

document.addEventListener('DOMContentLoaded', function(){
  applyLanguage(false);
  applyTheme();
  loadNews();
});

async function loadNews(){
  var grid = document.getElementById('newsGrid');
  grid.innerHTML = '<div class="state"><div class="spinner"></div>' + esc(t('loading')) + '</div>';
  try{
    var response = await IROUP_V2.public.newsList();
    if(!response || !response.success) throw new Error(response && response.error ? response.error : 'Unable to load news data');
    allNews = normalizeList(response).map(normalizeNews).filter(function(item){ return item.id; }).sort(function(a,b){ return dateVal(b.publish_date) - dateVal(a.publish_date); });
    populateFilters();
    updateKpis();
    renderNews();
  }catch(error){
    grid.innerHTML = '<div class="state">' + esc(t('loadFail')) + '<br>' + esc(error.message || String(error)) + '</div>';
    document.getElementById('pagination').innerHTML = '';
    document.getElementById('resultCount').textContent = '0 ' + t('items');
  }
}

function normalizeList(res){
  var data = res && typeof res.data !== 'undefined' ? res.data : res;
  if(Array.isArray(data)) return data;
  var keys = ['rows','records','items','news'];
  for(var i=0;i<keys.length;i++){ if(data && Array.isArray(data[keys[i]])) return data[keys[i]]; }
  return [];
}

function normalizeNews(row){
  var files = collectFiles(row).filter(isPublicFile);
  var cover = safeUrl(row.cover_url || row.cover_image_url || row.thumbnail_url) || firstFileUrl(files, 'cover') || firstFileUrl(files, 'image');
  return {
    id: clean(row.news_id || row.id),
    title_th: clean(row.title_th || row.title || row.name_th),
    title_en: clean(row.title_en || row.name_en),
    content_th: clean(row.content_th || row.content || row.summary_th || row.description_th),
    content_en: clean(row.content_en || row.summary_en || row.description_en),
    publish_date: normalizeDate(row.publish_date || row.published_at || row.created_at),
    category: clean(row.category || row.news_category || row.type),
    sdg_tags: clean(row.sdg_tags || row.sdg || row.tags),
    link_url: safeUrl(row.link_url || row.url),
    cover_url: cover,
    files: files
  };
}

function populateFilters(){
  var category = document.getElementById('categoryFilter');
  var sdg = document.getElementById('sdgFilter');
  var categories = unique(allNews.map(function(item){ return item.category; })).sort(function(a,b){ return a.localeCompare(b); });
  category.innerHTML = '<option value="">' + esc(t('allCategories')) + '</option>' + categories.map(function(item){ return '<option value="' + escAttr(item) + '">' + esc(item) + '</option>'; }).join('');
  sdg.innerHTML = '<option value="">' + esc(t('allSdg')) + '</option>' + Array.from({length:17}, function(_, index){
    var id = String(index + 1);
    return '<option value="' + id + '">SDG ' + id + '</option>';
  }).join('');
}

function updateKpis(){
  var monthKey = new Date().toISOString().slice(0,7);
  document.getElementById('kpiTotal').textContent = allNews.length.toLocaleString();
  document.getElementById('kpiCategories').textContent = unique(allNews.map(function(item){ return item.category; })).length.toLocaleString();
  document.getElementById('kpiMonth').textContent = allNews.filter(function(item){ return String(item.publish_date || '').slice(0,7) === monthKey; }).length.toLocaleString();
}

function renderNews(){
  var grid = document.getElementById('newsGrid');
  var rows = filteredNews();
  var totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  currentPage = Math.min(Math.max(1, currentPage), totalPages);
  var start = (currentPage - 1) * PAGE_SIZE;
  var pageRows = rows.slice(start, start + PAGE_SIZE);
  document.getElementById('resultCount').textContent = rows.length.toLocaleString() + ' ' + t('items');
  if(!pageRows.length){
    grid.innerHTML = '<div class="state">' + esc(t('noData')) + '</div>';
    renderPagination(rows.length);
    return;
  }
  grid.innerHTML = pageRows.map(renderCard).join('');
  renderPagination(rows.length);
}

function renderCard(item){
  var title = displayTitle(item) || '-';
  var content = displayContent(item);
  return '<article class="card">' +
    '<a href="public-news-detail.html?id=' + encodeURIComponent(item.id) + '" aria-label="' + escAttr(title) + '">' +
      '<div class="cover">' + (item.cover_url ? '<img src="' + escAttr(toImageUrl(item.cover_url, 1200)) + '" alt="' + escAttr(title) + '">' : '<span>' + esc(t('newsFallback')) + '</span>') + '</div>' +
    '</a>' +
    '<div class="more" aria-hidden="true">...</div>' +
    '<div class="body">' +
      '<div class="badges">' + (item.category ? '<span class="badge category">' + esc(item.category) + '</span>' : '') + renderSdgBadges(item.sdg_tags) + '</div>' +
      '<a class="title" href="public-news-detail.html?id=' + encodeURIComponent(item.id) + '">' + esc(title) + '</a>' +
      '<p class="excerpt">' + esc(truncate(content, 160)) + '</p>' +
      '<div class="file-row">' + renderFileChips(item) + '</div>' +
      '<div class="footer-row"><span>' + esc(formatDate(item.publish_date)) + '</span><a class="read-more" href="public-news-detail.html?id=' + encodeURIComponent(item.id) + '">' + esc(t('readMore')) + ' -></a></div>' +
    '</div>' +
  '</article>';
}

function filteredNews(){
  var q = clean(document.getElementById('searchInput').value).toLowerCase();
  var cat = document.getElementById('categoryFilter').value;
  var sdg = document.getElementById('sdgFilter').value;
  return allNews.filter(function(item){
    if(cat && item.category !== cat) return false;
    if(sdg && parseTags(item.sdg_tags).indexOf(sdg) < 0) return false;
    if(!q) return true;
    var text = [item.title_th,item.title_en,item.content_th,item.content_en,item.category,item.publish_date].join(' ').toLowerCase();
    return text.indexOf(q) >= 0;
  });
}

function renderPagination(total){
  var box = document.getElementById('pagination');
  var totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(total <= PAGE_SIZE){ box.innerHTML = total ? '<span class="page-info">' + total + ' ' + esc(t('items')) + '</span>' : ''; return; }
  var html = '<span class="page-info">' + esc(t('page')) + ' ' + currentPage + ' / ' + totalPages + '</span>';
  html += '<button class="page-btn" type="button" ' + (currentPage <= 1 ? 'disabled' : '') + ' onclick="setPage(' + (currentPage - 1) + ')">' + esc(t('prev')) + '</button>';
  var start = Math.max(1, currentPage - 2), end = Math.min(totalPages, currentPage + 2);
  for(var i=start;i<=end;i++){
    html += '<button class="page-btn ' + (i === currentPage ? 'active' : '') + '" type="button" onclick="setPage(' + i + ')">' + i + '</button>';
  }
  html += '<button class="page-btn" type="button" ' + (currentPage >= totalPages ? 'disabled' : '') + ' onclick="setPage(' + (currentPage + 1) + ')">' + esc(t('next')) + '</button>';
  box.innerHTML = html;
}

function setPage(page){
  currentPage = page;
  renderNews();
  document.querySelector('.section-head').scrollIntoView({behavior:'smooth',block:'start'});
}

function onFilterChange(){
  currentPage = 1;
  renderNews();
}

function clearFilters(){
  document.getElementById('searchInput').value = '';
  document.getElementById('categoryFilter').value = '';
  document.getElementById('sdgFilter').value = '';
  onFilterChange();
}

function setLang(lang){
  currentLang = normalizeLang(lang);
  localStorage.setItem('iroup_public_lang', currentLang);
  applyLanguage(true);
}

function applyLanguage(rerender){
  document.documentElement.lang = currentLang === 'EN' ? 'en' : 'th';
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){ el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
  document.querySelectorAll('.lang-btn').forEach(function(btn){ btn.classList.toggle('active', btn.dataset.lang === currentLang); });
  document.title = (currentLang === 'EN' ? 'News' : 'ข่าวสาร') + ' | iROUP';
  if(allNews.length) populateFilters();
  if(rerender) renderNews();
}

function applyTheme(){
  var theme = document.documentElement.getAttribute('data-theme') || 'dark';
  document.getElementById('themeToggle').textContent = theme === 'light' ? 'Light' : 'Dark';
}

function toggleTheme(){
  var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('iroup_public_theme', next);
  applyTheme();
}

function displayTitle(item){ return currentLang === 'EN' ? item.title_en || item.title_th : item.title_th || item.title_en; }
function displayContent(item){ return currentLang === 'EN' ? item.content_en || item.content_th : item.content_th || item.content_en; }

function renderSdgBadges(value){
  return parseTags(value).slice(0,3).map(function(tag){
    if(window.IROUP_SDG_ICONS) return IROUP_SDG_ICONS.renderBadge(tag, { lang: currentLang === 'EN' ? 'en' : 'th', label: 'SDG ' + tag });
    return '<span class="badge sdg">SDG ' + esc(tag) + '</span>';
  }).join('');
}

function renderFileChips(item){
  var roles = unique((item.files || []).map(function(file){ return clean(file.file_role_id || file.role || file.file_type || file.mime_type); })).slice(0,3);
  return roles.map(function(role){ return '<span class="file-chip">' + esc(role) + '</span>'; }).join('');
}

function collectFiles(row){
  var groups = [];
  if(Array.isArray(row.files)) groups.push(row.files);
  if(row.files && typeof row.files === 'object' && !Array.isArray(row.files)){
    Object.keys(row.files).forEach(function(key){ if(Array.isArray(row.files[key])) groups.push(row.files[key]); });
  }
  if(Array.isArray(row.public_files)) groups.push(row.public_files);
  if(row.file_summary && Array.isArray(row.file_summary.files)) groups.push(row.file_summary.files);
  return groups.reduce(function(acc, group){ return acc.concat(group); }, []).filter(Boolean);
}

function isPublicFile(file){
  var visibility = clean(file && file.visibility_level);
  return !visibility || visibility === 'public';
}

function firstFileUrl(files, role){
  var match = (files || []).find(function(file){ return clean(file.file_role_id || file.role).toLowerCase() === role; });
  return match ? safeUrl(match.file_url || match.thumbnail_url || match.url || match.drive_url) : '';
}

function toImageUrl(url, size){
  var value = safeUrl(url);
  var match = value.match(/\/file\/d\/([^/]+)/) || value.match(/[?&]id=([^&]+)/);
  if(match && match[1]) return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(match[1]) + '&sz=w' + (size || 1200);
  return value;
}

function parseTags(value){
  return clean(value).split(/[,|]/).map(function(item){ return clean(item).replace(/^SDG[-\s]*/i,''); }).filter(Boolean);
}

function normalizeDate(value){
  var text = clean(value);
  if(!text) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
  var date = new Date(text);
  if(isNaN(date.getTime())) return text;
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
}

function formatDate(value){
  var date = new Date(value);
  if(!value || isNaN(date.getTime())) return '-';
  return date.toLocaleDateString(currentLang === 'EN' ? 'en-US' : 'th-TH', { year:'numeric', month:'long', day:'numeric' });
}

function dateVal(value){
  var date = new Date(value);
  return isNaN(date.getTime()) ? 0 : date.getTime();
}

function truncate(value, max){
  var text = clean(value).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
  return text.length <= max ? text : text.slice(0, max - 1).trim() + '…';
}

function normalizeLang(lang){ return String(lang || '').toUpperCase() === 'EN' ? 'EN' : 'TH'; }
function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.TH[key] || key; }
function unique(values){ return Array.from(new Set((values || []).map(clean).filter(Boolean))); }
function clean(value){ return String(value === null || value === undefined ? '' : value).trim(); }
function safeUrl(value){ var text = clean(value); return (!text || text === '-' || text.toLowerCase() === 'undefined' || text.toLowerCase() === 'null') ? '' : text; }
function esc(value){ return clean(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escAttr(value){ return esc(value); }
</script>
<script src="../js/pwa-register.js"></script>
</body>
</html>
