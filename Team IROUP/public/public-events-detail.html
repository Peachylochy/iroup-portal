<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IROUP Public">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>กิจกรรม | iROUP</title>
<script>
(function(){
  var theme = localStorage.getItem('iroup_public_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<script src="../js/iroup-rich-lite.js"></script>
<link rel="stylesheet" href="../css/iroup-theme.css">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#061526;--surface:rgba(10,32,56,.9);--surface-2:rgba(14,38,64,.78);
  --line:rgba(111,159,214,.22);--line-strong:rgba(93,178,255,.36);
  --text:#f3f8ff;--soft:#c7d9ec;--muted:#8aa6c4;--dim:#5f7898;
  --blue:#2387ff;--cyan:#2bd8ff;--violet:#8b5cf6;--gold:#f7b733;--green:#5ee38c;--red:#ff6b7a;
  --shadow:0 24px 70px rgba(0,0,0,.28);
  --hero:url("../assets/events-hero-dark.webp");
}
:root[data-theme="light"]{
  --bg:#f6fbff;--surface:#fff;--surface-2:#f6fbff;
  --line:rgba(31,84,142,.13);--line-strong:rgba(35,135,255,.24);
  --text:#0d2542;--soft:#274461;--muted:#657991;--dim:#8a9aab;
  --blue:#176fe8;--cyan:#21aee8;--violet:#7c3aed;--gold:#d99012;--green:#2ea85b;--red:#dc4254;
  --shadow:0 18px 50px rgba(34,71,108,.13);
  --hero:url("../assets/events-hero-light.webp");
}
body{min-height:100vh;background:linear-gradient(180deg,var(--bg),#04101d 60%,var(--bg));color:var(--text);font-family:'Prompt',sans-serif}
:root[data-theme="light"] body{background:linear-gradient(180deg,#fbfdff 0%,#f5faff 52%,#fff 100%)}
a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:100;height:62px;padding:0 4%;display:flex;align-items:center;justify-content:space-between;background:rgba(4,14,27,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
:root[data-theme="light"] .topbar{background:rgba(255,255,255,.86)}
.brand{display:flex;align-items:center;gap:10px}.brand img{height:44px;max-width:132px;width:auto;object-fit:contain}.brand-fallback{display:none;font-weight:900}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nav a,.theme-toggle,.lang-btn{border:1px solid transparent;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;color:var(--soft);background:transparent;cursor:pointer}
.nav a:hover,.nav a.active{background:rgba(35,135,255,.14);border-color:rgba(35,135,255,.28);color:var(--text)}
.lang{display:flex;gap:4px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang-btn{padding:6px 10px}.lang-btn.active{background:var(--blue);color:#fff}
.theme-toggle,.admin-link{background:rgba(255,255,255,.06)!important;border-color:var(--line)!important}
.hero{position:relative;overflow:hidden;min-height:300px;padding:48px 5%;background-image:linear-gradient(90deg,rgba(6,18,33,.98) 0%,rgba(6,18,33,.76) 38%,rgba(6,18,33,.08) 78%),var(--hero);background-size:cover;background-position:center right;border-bottom:1px solid var(--line)}
:root[data-theme="light"] .hero{background-image:linear-gradient(90deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.76) 38%,rgba(255,255,255,.08) 78%),var(--hero)}
.hero-inner{width:min(1180px,90%);margin:0 auto}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:800;margin-bottom:18px}
.hero h1{font-size:clamp(30px,3.8vw,50px);line-height:1.15;font-weight:900;max-width:860px}
.meta{margin-top:14px;color:var(--muted);font-family:'Sarabun',sans-serif;font-size:15px;line-height:1.6}
.flag{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);margin-right:8px}
.shell{width:min(1180px,90%);margin:0 auto;padding:28px 0 64px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}
.cover{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);margin-bottom:18px}
.cover img{width:100%;aspect-ratio:16/9;max-height:520px;object-fit:contain;display:block}
.article,.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 52px rgba(0,0,0,.13)}
.article{padding:28px}
.content{font-family:'Sarabun',sans-serif;color:var(--soft);font-size:16px;line-height:1.9;white-space:pre-wrap}
.no-content{font-family:'Sarabun',sans-serif;color:var(--muted);font-size:15px;font-style:italic;padding:12px 0}
.panel{padding:18px;position:sticky;top:82px}
.panel h2{font-size:16px;margin-bottom:12px}
.facts{display:grid;gap:10px;margin-bottom:16px}
.fact{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.04)}
.fact-label{font-size:11px;color:var(--muted);font-weight:800}
.fact-value{font-size:13px;color:var(--text);font-weight:800;margin-top:3px}
.actions{display:grid;gap:9px}
.action{display:flex;justify-content:center;align-items:center;border:1px solid var(--line);border-radius:12px;min-height:42px;padding:9px 12px;font-size:13px;font-weight:900;color:var(--soft);background:rgba(255,255,255,.04)}
.action.primary{background:rgba(35,135,255,.14);border-color:rgba(35,135,255,.28);color:var(--cyan)}
.action.join{background:rgba(94,227,140,.12);border-color:rgba(94,227,140,.28);color:var(--green)}
:root[data-theme="light"] .action{background:#f7fbff}
.status{display:inline-flex;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;margin-top:16px}
.status.upcoming{background:rgba(35,135,255,.16);color:var(--cyan)}
.status.ongoing{background:rgba(94,227,140,.16);color:var(--green)}
.status.done{background:rgba(127,145,166,.16);color:var(--muted)}
.state{padding:44px 18px;text-align:center;color:var(--muted);font-family:'Sarabun',sans-serif;background:var(--surface);border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}
.spinner{width:30px;height:30px;border-radius:50%;border:4px solid rgba(35,135,255,.16);border-top-color:var(--blue);animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{border-top:1px solid var(--line);padding:24px 5%;text-align:center;color:var(--dim);font-family:'Sarabun',sans-serif;font-size:12px}
@media(max-width:940px){
  .topbar{height:auto;min-height:64px;padding-top:12px;padding-bottom:12px;align-items:flex-start}
  .nav{max-width:100%;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start}
  .shell{grid-template-columns:1fr}.panel{position:static}
  .hero-inner,.shell{width:92%}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="public-landing.html"><img src="../assets/IROUP_LOGO.webp" alt="iROUP" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span class="brand-fallback">iROUP</span></a>
  <nav class="nav" aria-label="Public navigation">
    <a href="public-news.html" data-i18n="navNews">ข่าวสาร</a>
    <a href="public-knowledge.html" data-i18n="navKnowledge">คลังความรู้</a>
    <a href="public-scholar.html" data-i18n="navScholar">ทุนการศึกษา</a>
    <a class="active" href="public-events.html" data-i18n="navEvents">กิจกรรม</a>
    <a href="public-mou.html">MOU</a>
    <a href="public-mobility.html">Mobility</a>
    <span class="lang"><button class="lang-btn active" type="button" data-lang="TH" onclick="setLang('TH')">TH</button><button class="lang-btn" type="button" data-lang="EN" onclick="setLang('EN')">EN</button></span>
    <button class="theme-toggle" type="button" id="themeToggle" onclick="toggleTheme()">Dark</button>

  </nav>
</header>

<section class="hero">
  <div class="hero-inner" id="heroBox">
    <a class="back" href="public-events.html" data-i18n="back">← กลับไปหน้ากิจกรรม</a>
    <div class="state"><div class="spinner"></div><span data-i18n="loading">กำลังโหลดรายละเอียดกิจกรรม...</span></div>
  </div>
</section>

<main class="shell" id="detailShell"></main>
<footer>© 2569 International Relations Office - University of Phayao</footer>

<script src="../js/iroup-config.js"></script>
<script src="../js/iroup-v2-endpoint.js"></script>
<script src="../js/iroup-v2-api.js"></script>
<script>
var currentLang = normalizeLang(localStorage.getItem('iroup_public_lang') || 'TH');
var currentItem = null;

var I18N = {
  TH: {
    navNews:'ข่าวสาร',navKnowledge:'คลังความรู้',navScholar:'ทุนการศึกษา',navEvents:'กิจกรรม',admin:'Admin',
    back:'← กลับไปหน้ากิจกรรม',
    loading:'กำลังโหลดรายละเอียดกิจกรรม...',
    notFound:'ไม่พบข้อมูลกิจกรรม',
    join:'เข้าร่วมกิจกรรม',link:'เว็บไซต์กิจกรรม',file:'ไฟล์แนบ',
    dateRange:'วันที่',timeRange:'เวลา',location:'สถานที่',country:'ประเทศ',
    organizer:'หน่วยงาน',eventType:'ประเภทกิจกรรม',eventMode:'รูปแบบ',participants:'จำนวนผู้เข้าร่วม',
    noContent:'ยังไม่มีเนื้อหารายละเอียดกิจกรรม',
    upcomingStatus:'กำลังจะมาถึง',ongoingStatus:'กำลังดำเนินการ',doneStatus:'เสร็จสิ้น',
    modeOnline:'ออนไลน์',modeOnsite:'ออนไซต์',modeHybrid:'ไฮบริด',
    themeDark:'Dark',themeLight:'Light'
  },
  EN: {
    navNews:'News',navKnowledge:'Knowledge',navScholar:'Scholarships',navEvents:'Events',admin:'Admin',
    back:'← Back to Events',
    loading:'Loading event detail...',
    notFound:'Event not found',
    join:'Join Event',link:'Event Website',file:'Attachment',
    dateRange:'Date',timeRange:'Time',location:'Location',country:'Country',
    organizer:'Organizer',eventType:'Event Type',eventMode:'Mode',participants:'Participants',
    noContent:'No event detail content yet.',
    upcomingStatus:'Upcoming',ongoingStatus:'Ongoing',doneStatus:'Past',
    modeOnline:'Online',modeOnsite:'Onsite',modeHybrid:'Hybrid',
    themeDark:'Dark',themeLight:'Light'
  }
};

document.addEventListener('DOMContentLoaded', function(){ applyLanguage(false); applyTheme(); loadDetail(); });

async function loadDetail(){
  try{
    var id = new URLSearchParams(location.search).get('id') || '';
    var response = await IROUP_V2.public.eventList();
    if(!response || !response.success) throw new Error(response && response.error ? response.error : 'Unable to load event data');
    var rows = normalizeList(response).map(normalizeEvent);
    currentItem = rows.find(function(item){ return item.id === id; }) || null;
    if(!currentItem){ renderNotFound(); return; }
    renderDetail();
  }catch(error){
    document.getElementById('heroBox').innerHTML =
      '<a class="back" href="public-events.html">' + esc(t('back')) + '</a>' +
      '<div class="state">' + esc(error.message || String(error)) + '</div>';
    document.getElementById('detailShell').innerHTML = '';
  }
}

function normalizeList(response){
  if(Array.isArray(response.data)) return response.data;
  if(response.data && Array.isArray(response.data.items)) return response.data.items;
  return [];
}

function normalizeEvent(row){
  var files = flattenFiles(row.files);
  return {
    id: row.event_id || row.id || '',
    title_th: row.title_th || row.title || '',
    title_en: row.title_en || row.title || row.title_th || '',
    event_type: row.event_type || '',
    event_mode: String(row.event_mode || '').toLowerCase(),
    organizer_th: unitName(row.organizer, 'TH'),
    organizer_en: unitName(row.organizer, 'EN'),
    country_name_th: countryName(row.country, 'TH'),
    country_name_en: countryName(row.country, 'EN'),
    country_flag: countryFlag(row.country),
    location: row.location || '',
    meeting_url: row.meeting_url || '',
    start_date: row.start_date || '',
    end_date: row.end_date || row.start_date || '',
    start_time: row.start_time || '',
    end_time: row.end_time || '',
    participant_count: row.participant_count || '',
    detail_th: row.detail_th || '',
    detail_en: row.detail_en || '',
    link_url: row.link_url || '',
    status_raw: row.status || '',
    files: files,
    poster: posterUrl(files)
  };
}

function renderDetail(){
  var item = currentItem;
  var title = currentLang === 'EN' ? (item.title_en || item.title_th) : (item.title_th || item.title_en);
  var status = eventStatus(item);
  var country = currentLang === 'EN'
    ? (item.country_name_en || item.country_name_th)
    : (item.country_name_th || item.country_name_en);
  var org = displayOrganizer(item);
  document.title = esc(title) + ' | iROUP';

  document.getElementById('heroBox').innerHTML =
    '<a class="back" href="public-events.html">' + esc(t('back')) + '</a>' +
    '<h1>' + esc(title) + '</h1>' +
    '<p class="meta">' +
      (item.country_flag ? '<span class="flag">' + esc(item.country_flag) + '</span>' : '') +
      esc(item.location || country || '-') +
      (org ? ' · ' + esc(org) : '') +
    '</p>' +
    '<span class="status ' + escAttr(status.status) + '">' + esc(status.label) + '</span>';

  var content = (currentLang === 'EN' ? (item.detail_en || item.detail_th) : (item.detail_th || item.detail_en)) || '';
  var file = publicFile(item.files);
  var joinUrl = item.meeting_url || item.link_url || '';
  var externalUrl = (item.link_url && item.link_url !== joinUrl) ? item.link_url : '';
  var modeLabel = item.event_mode === 'online' ? t('modeOnline')
    : item.event_mode === 'hybrid' ? t('modeHybrid')
    : (item.event_mode === 'onsite' || item.event_mode === 'offline') ? t('modeOnsite')
    : item.event_mode;

  document.getElementById('detailShell').innerHTML =
    '<section>' +
      (item.poster ? '<div class="cover"><img src="' + escAttr(item.poster) + '" alt="' + escAttr(title) + '"></div>' : '') +
      '<article class="article">' +
        (content
          ? '<div class="content">' + renderRichContent(content) + '</div>'
          : '<p class="no-content">' + esc(t('noContent')) + '</p>') +
      '</article>' +
    '</section>' +
    '<aside class="panel">' +
      '<h2>' + esc(t('navEvents')) + '</h2>' +
      '<div class="facts">' +
        fact(t('dateRange'), formatDateRange(item.start_date, item.end_date) || '-') +
        (item.start_time ? fact(t('timeRange'), item.start_time + (item.end_time ? ' – ' + item.end_time : '')) : '') +
        fact(t('location'), item.location || (item.event_mode === 'online' ? t('modeOnline') : '-') || '-') +
        fact(t('country'), (item.country_flag ? item.country_flag + ' ' : '') + (country || '-')) +
        (org ? fact(t('organizer'), org) : '') +
        (item.event_type ? fact(t('eventType'), item.event_type) : '') +
        (modeLabel ? fact(t('eventMode'), modeLabel) : '') +
        (item.participant_count ? fact(t('participants'), String(item.participant_count)) : '') +
      '</div>' +
      '<div class="actions">' +
        (joinUrl ? '<a class="action join" target="_blank" rel="noopener" href="' + escAttr(joinUrl) + '">' + esc(t('join')) + '</a>' : '') +
        (externalUrl ? '<a class="action primary" target="_blank" rel="noopener" href="' + escAttr(externalUrl) + '">' + esc(t('link')) + '</a>' : '') +
        (file ? '<a class="action" target="_blank" rel="noopener" href="' + escAttr(file.file_url || file.url) + '">' + esc(t('file')) + '</a>' : '') +
      '</div>' +
    '</aside>';
}

function renderNotFound(){
  document.getElementById('heroBox').innerHTML =
    '<a class="back" href="public-events.html">' + esc(t('back')) + '</a>' +
    '<div class="state">' + esc(t('notFound')) + '</div>';
  document.getElementById('detailShell').innerHTML = '';
}

function fact(label, value){
  return '<div class="fact"><div class="fact-label">' + esc(label) + '</div><div class="fact-value">' + esc(value) + '</div></div>';
}
function displayOrganizer(item){
  return currentLang === 'EN' ? (item.organizer_en || item.organizer_th) : (item.organizer_th || item.organizer_en);
}
function renderRichContent(value){ return window.IROUP_RICH_LITE ? IROUP_RICH_LITE.render(value) : esc(value); }
function eventStatus(item){
  var today = startOfDay(new Date());
  var s = parseDate(item.start_date);
  var e = parseDate(item.end_date) || s;
  if(s && today < s) return {status:'upcoming', label:t('upcomingStatus')};
  if(e && today > e) return {status:'done', label:t('doneStatus')};
  return {status:'ongoing', label:t('ongoingStatus')};
}
function parseDate(value){
  if(!value) return null;
  var d = new Date(value);
  return Number.isNaN(d.getTime()) ? null : startOfDay(d);
}
function startOfDay(date){ return new Date(date.getFullYear(), date.getMonth(), date.getDate()); }
function formatDateRange(start, end){
  if(!start) return '-';
  var s = new Date(start), e = end ? new Date(end) : null;
  if(Number.isNaN(s.getTime())) return String(start);
  var locale = currentLang === 'EN' ? 'en-US' : 'th-TH';
  var opts = { day:'numeric', month:'short', year:'numeric' };
  var sStr = s.toLocaleDateString(locale, opts);
  if(!e || Number.isNaN(e.getTime()) || e.toDateString() === s.toDateString()) return sStr;
  return sStr + ' – ' + e.toLocaleDateString(locale, opts);
}
function unitName(unit, lang){
  if(!unit) return '';
  if(typeof unit === 'string') return unit;
  return lang === 'EN' ? (unit.unit_name_en || unit.unit_name_th || '') : (unit.unit_name_th || unit.unit_name_en || '');
}
function countryName(country, lang){
  if(!country) return '';
  if(typeof country === 'string') return country;
  return lang === 'EN'
    ? (country.country_name_en || country.country_name_th || country.country_id || '')
    : (country.country_name_th || country.country_name_en || country.country_id || '');
}
function countryFlag(country){ return country && typeof country === 'object' ? country.flag_emoji || '' : ''; }
function flattenFiles(files){
  if(!files) return [];
  if(Array.isArray(files)) return files.filter(Boolean);
  if(typeof files !== 'object') return [];
  return Object.keys(files).reduce(function(acc,key){ return acc.concat(Array.isArray(files[key]) ? files[key] : []); }, []).filter(Boolean);
}
function posterUrl(files){
  var poster = files.find(function(file){
    var role = fileRoleKey(file);
    var mime = String(file.mime_type || '').toLowerCase();
    return (role === 'poster' || role === 'cover' || role === 'image' || mime.indexOf('image/') === 0) && (file.thumbnail_url || file.file_url || file.url);
  });
  return poster ? previewUrl(poster.thumbnail_url || poster.file_url || poster.url) : '';
}
function publicFile(files){
  return files.find(function(file){
    if(!file || !(file.file_url || file.url)) return false;
    var role = fileRoleKey(file);
    var mime = String(file.mime_type || '').toLowerCase();
    if(role === 'poster' || role === 'cover' || role === 'image') return false;
    if(mime.indexOf('image/') === 0) return false;
    return true;
  }) || null;
}
function fileRoleKey(file){
  var raw = String(file.file_role_id || file.role_id || file.role || file.file_role_name || '').toLowerCase();
  if(raw.indexOf('poster') >= 0) return 'poster';
  if(raw.indexOf('cover') >= 0) return 'cover';
  if(raw.indexOf('image') >= 0 || raw.indexOf('banner') >= 0) return 'image';
  if(raw.indexOf('attach') >= 0 || raw.indexOf('pdf') >= 0 || raw.indexOf('document') >= 0) return 'attachment';
  return raw;
}
function previewUrl(url){
  var u = String(url || '').trim();
  var match = u.match(/\/file\/d\/([^/]+)/) || u.match(/[?&]id=([^&]+)/);
  return match && match[1] ? 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w1600' : u;
}
function setLang(lang){
  currentLang = normalizeLang(lang);
  localStorage.setItem('iroup_public_lang', currentLang);
  applyLanguage(true);
}
function applyLanguage(rerender){
  document.documentElement.lang = currentLang === 'EN' ? 'en' : 'th';
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('.lang-btn').forEach(function(btn){ btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang); });
  applyTheme();
  if(rerender && currentItem) renderDetail();
}
function toggleTheme(){
  var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('iroup_public_theme', next);
  applyTheme();
}
function applyTheme(){
  var btn = document.getElementById('themeToggle');
  if(btn) btn.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? t('themeLight') : t('themeDark');
}
function normalizeLang(lang){ return String(lang || '').toUpperCase() === 'EN' ? 'EN' : 'TH'; }
function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.TH[key] || key; }
function esc(value){ return String(value == null ? '' : value).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
