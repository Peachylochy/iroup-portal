<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#061526;--surface:rgba(10,32,56,.9);--surface-2:rgba(14,38,64,.78);--line:rgba(111,159,214,.22);--line-strong:rgba(93,178,255,.36);--text:#f3f8ff;--soft:#c7d9ec;--muted:#8aa6c4;--dim:#5f7898;--blue:#2387ff;--cyan:#2bd8ff;--violet:#8b5cf6;--gold:#f7b733;--green:#5ee38c;--red:#ff6b7a;--shadow:0 24px 70px rgba(0,0,0,.28);--hero:url("../assets/scholarship-hero-dark.webp")}
:root[data-theme="light"]{--bg:#f6fbff;--surface:#fff;--surface-2:#f6fbff;--line:rgba(31,84,142,.13);--line-strong:rgba(35,135,255,.24);--text:#0d2542;--soft:#274461;--muted:#657991;--dim:#8a9aab;--blue:#176fe8;--cyan:#21aee8;--violet:#7c3aed;--gold:#d99012;--green:#2ea85b;--red:#dc4254;--shadow:0 18px 50px rgba(34,71,108,.13);--hero:url("../assets/scholarship-hero-light.webp")}
body{min-height:100vh;background:linear-gradient(180deg,var(--bg),#04101d 60%,var(--bg));color:var(--text);font-family:'Prompt',sans-serif}
:root[data-theme="light"] body{background:linear-gradient(180deg,#fbfdff 0%,#f5faff 52%,#fff 100%)}
a{color:inherit;text-decoration:none}.topbar{position:sticky;top:0;z-index:100;height:62px;padding:0 4%;display:flex;align-items:center;justify-content:space-between;background:rgba(4,14,27,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
:root[data-theme="light"] .topbar{background:rgba(255,255,255,.86)}.brand img{height:44px;max-width:132px;width:auto;object-fit:contain}.brand-fallback{display:none;font-weight:900}.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}.nav a,.theme-toggle,.lang-btn{border:1px solid transparent;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;color:var(--soft);background:transparent;cursor:pointer}.nav a:hover,.nav a.active{background:rgba(35,135,255,.14);border-color:rgba(35,135,255,.28);color:var(--text)}.lang{display:flex;gap:4px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:3px}.lang-btn{padding:6px 10px}.lang-btn.active{background:var(--blue);color:#fff}.theme-toggle,.admin-link{background:rgba(255,255,255,.06)!important;border-color:var(--line)!important}
.hero{position:relative;overflow:hidden;min-height:300px;padding:48px 5%;background-image:linear-gradient(90deg,rgba(6,18,33,.98) 0%,rgba(6,18,33,.76) 38%,rgba(6,18,33,.08) 78%),var(--hero);background-size:cover;background-position:center right;border-bottom:1px solid var(--line)}
:root[data-theme="light"] .hero{background-image:linear-gradient(90deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.76) 38%,rgba(255,255,255,.08) 78%),var(--hero)}.hero-inner{width:min(1180px,90%);margin:0 auto}.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:800;margin-bottom:18px}.hero h1{font-size:clamp(30px,3.8vw,50px);line-height:1.15;font-weight:900;max-width:860px}.meta{margin-top:14px;color:var(--muted);font-family:'Sarabun',sans-serif;font-size:15px;line-height:1.6}
.shell{width:min(1180px,90%);margin:0 auto;padding:28px 0 64px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}.cover{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);margin-bottom:18px}.cover img{width:100%;aspect-ratio:16/9;max-height:520px;object-fit:contain;display:block}.article,.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 52px rgba(0,0,0,.13)}.article{padding:28px}.content{font-family:'Sarabun',sans-serif;color:var(--soft);font-size:16px;line-height:1.9;white-space:pre-wrap}.content h3{font-family:'Prompt',sans-serif;color:var(--text);font-size:19px;margin:24px 0 8px}.panel{padding:18px;position:sticky;top:82px}.panel h2{font-size:16px;margin-bottom:12px}.facts{display:grid;gap:10px;margin-bottom:16px}.fact{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.04)}.fact-label{font-size:11px;color:var(--muted);font-weight:800}.fact-value{font-size:13px;color:var(--text);font-weight:800;margin-top:3px}.actions{display:grid;gap:9px}.action{display:flex;justify-content:center;align-items:center;border:1px solid var(--line);border-radius:12px;min-height:42px;padding:9px 12px;font-size:13px;font-weight:900;color:var(--soft);background:rgba(255,255,255,.04)}.action.primary{background:rgba(46,168,91,.16);border-color:rgba(46,168,91,.28);color:var(--green)}.status{display:inline-flex;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;margin-top:16px}.status.open{background:rgba(46,168,91,.16);color:var(--green)}.status.upcoming{background:rgba(35,135,255,.16);color:var(--cyan)}.status.closed{background:rgba(127,145,166,.16);color:var(--muted)}.state{padding:44px 18px;text-align:center;color:var(--muted);font-family:'Sarabun',sans-serif;background:var(--surface);border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}.spinner{width:30px;height:30px;border-radius:50%;border:4px solid rgba(35,135,255,.16);border-top-color:var(--blue);animation:spin 1s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}footer{border-top:1px solid var(--line);padding:24px 5%;text-align:center;color:var(--dim);font-family:'Sarabun',sans-serif;font-size:12px}
@media(max-width:940px){.topbar{height:auto;min-height:64px;padding-top:12px;padding-bottom:12px;align-items:flex-start}.nav{max-width:100%;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start}.shell{grid-template-columns:1fr}.panel{position:static}.hero-inner,.shell{width:92%}}
</style>

<script>
var currentLang = normalizeLang(localStorage.getItem('iroup_public_lang') || 'TH');
var currentItem = null;
var I18N = {
  TH:{navNews:'ข่าวสาร',navKnowledge:'คลังความรู้',navScholar:'ทุนการศึกษา',navEvents:'กิจกรรม',admin:'Admin',back:'← กลับไปหน้าทุนการศึกษา',loading:'กำลังโหลดรายละเอียดทุน...',notFound:'ไม่พบข้อมูลทุน',apply:'สมัครทุน',external:'ระเบียบการ/เว็บไซต์ทุน',file:'ไฟล์แนบ',deadline:'วันปิดรับ',openDate:'วันเปิดรับ',institution:'สถาบัน',country:'ประเทศ',funding:'รูปแบบทุน',target:'กลุ่มเป้าหมาย',noContent:'ยังไม่มีเนื้อหารายละเอียดทุน',themeDark:'Dark',themeLight:'Light',openStatus:'กำลังรับสมัคร',upcomingStatus:'ยังไม่เปิดรับ',closedStatus:'ปิดรับแล้ว'},
  EN:{navNews:'News',navKnowledge:'Knowledge',navScholar:'Scholarships',navEvents:'Events',admin:'Admin',back:'← Back to Scholarships',loading:'Loading scholarship detail...',notFound:'Scholarship not found',apply:'Apply',external:'Official detail',file:'Attachment',deadline:'Deadline',openDate:'Open date',institution:'Institution',country:'Country',funding:'Funding',target:'Target group',noContent:'No scholarship detail content yet.',themeDark:'Dark',themeLight:'Light',openStatus:'Open',upcomingStatus:'Upcoming',closedStatus:'Closed'}
};

document.addEventListener('DOMContentLoaded', function(){ applyLanguage(false); applyTheme(); loadDetail(); });

async function loadDetail(){
  try{
    var id = new URLSearchParams(location.search).get('id') || '';
    var response = await IROUP_V2.public.scholarshipList();
    if(!response || !response.success) throw new Error(response && response.error ? response.error : 'Unable to load scholarship data');
    var rows = normalizeList(response).map(normalizeScholarship);
    currentItem = rows.find(function(item){ return item.id === id; }) || null;
    if(!currentItem){ renderNotFound(); return; }
    renderDetail();
  }catch(error){
    document.getElementById('heroBox').innerHTML = '<a class="back" href="public-scholar.html">' + esc(t('back')) + '</a><div class="state">' + esc(error.message || String(error)) + '</div>';
    document.getElementById('detailShell').innerHTML = '';
  }
}
function normalizeList(response){ if(Array.isArray(response.data)) return response.data; if(response.data && Array.isArray(response.data.items)) return response.data.items; return []; }
function normalizeScholarship(row){
  var files = flattenFiles(row.files);
  return {id:row.scholarship_id || row.id || '',title_th:row.title_th || row.title || '',title_en:row.title_en || row.title || row.title_th || '',institution:row.institution_name || row.institution || '',country_name_en:countryName(row.country,'EN'),country_name_th:countryName(row.country,'TH'),country_flag:'',scholarship_type:row.scholarship_type || '',funding_type:row.funding_type || '',target_group:row.target_group || row.level || '',cover_summary:row.cover_summary || '',coverage_th:row.coverage_th || row.coverage || '',coverage_en:row.coverage_en || row.coverage || '',content_th:row.content_th || '',content_en:row.content_en || '',open_date:row.open_date || row.start_date || '',close_date:row.close_date || row.end_date || '',detail_url:row.detail_url || row.link_url || '',apply_url:row.apply_url || '',link_url:row.link_url || '',status_raw:row.status || '',files:files,poster:posterUrl(files)};
}
function renderDetail(){
  var item = currentItem;
  var title = displayTitle(item);
  var country = displayCountry(item);
  var status = scholarshipStatus(item);
  document.title = title + ' | iROUP';
  document.getElementById('heroBox').innerHTML = '<a class="back" href="public-scholar.html">' + esc(t('back')) + '</a><h1>' + esc(title) + '</h1><p class="meta">' + esc(item.institution || '-') + ' · ' + esc(country || '-') + '</p><span class="status ' + escAttr(status.status) + '">' + esc(status.label) + '</span>';
  var content = displayContent(item) || item.cover_summary || t('noContent');
  var file = publicFile(item.files);
  document.getElementById('detailShell').innerHTML =
    '<section>' +
      (item.poster ? '<div class="cover"><img src="' + escAttr(item.poster) + '" alt="' + escAttr(title) + '"></div>' : '') +
      '<article class="article"><div class="content">' + renderContent(content) + '</div></article>' +
    '</section>' +
    '<aside class="panel"><h2>' + esc(t('navScholar')) + '</h2><div class="facts">' +
      fact(t('institution'), item.institution || '-') +
      fact(t('country'), country || '-') +
      fact(t('funding'), labelFunding(item.funding_type) || '-') +
      fact(t('target'), labelTarget(item.target_group) || '-') +
      fact(t('openDate'), formatDate(item.open_date) || '-') +
      fact(t('deadline'), formatDate(item.close_date) || '-') +
    '</div><div class="actions">' +
      (item.apply_url ? '<a class="action primary" target="_blank" rel="noopener" href="' + escAttr(item.apply_url) + '">' + esc(t('apply')) + '</a>' : '') +
      ((item.detail_url || item.link_url) ? '<a class="action" target="_blank" rel="noopener" href="' + escAttr(item.detail_url || item.link_url) + '">' + esc(t('external')) + '</a>' : '') +
      (file ? '<a class="action" target="_blank" rel="noopener" href="' + escAttr(file.file_url || file.url) + '">' + esc(t('file')) + '</a>' : '') +
    '</div></aside>';
}
function renderNotFound(){ document.getElementById('heroBox').innerHTML = '<a class="back" href="public-scholar.html">' + esc(t('back')) + '</a><div class="state">' + esc(t('notFound')) + '</div>'; document.getElementById('detailShell').innerHTML = ''; }
function fact(label,value){ return '<div class="fact"><div class="fact-label">' + esc(label) + '</div><div class="fact-value">' + esc(value) + '</div></div>'; }
function displayTitle(item){ return currentLang === 'EN' ? item.title_en || item.title_th : item.title_th || item.title_en; }
function displayContent(item){ return currentLang === 'EN' ? item.content_en || item.content_th || item.coverage_en || item.coverage_th : item.content_th || item.content_en || item.coverage_th || item.coverage_en; }
function displayCountry(item){ var name = currentLang === 'EN' ? item.country_name_en || item.country_name_th : item.country_name_th || item.country_name_en; return cleanCountryName(name); }
function renderContent(value){ return window.IROUP_RICH_LITE ? IROUP_RICH_LITE.render(value) : esc(value); }
function scholarshipStatus(item){ var today = startOfDay(new Date()), openDate = parseDate(item.open_date), closeDate = parseDate(item.close_date); if(openDate && today < openDate) return {status:'upcoming',label:t('upcomingStatus')}; if(closeDate && today > closeDate) return {status:'closed',label:t('closedStatus')}; return {status:'open',label:t('openStatus')}; }
function parseDate(value){ if(!value) return null; var d = new Date(value); return Number.isNaN(d.getTime()) ? null : startOfDay(d); }
function startOfDay(date){ return new Date(date.getFullYear(), date.getMonth(), date.getDate()); }
function flattenFiles(files){ if(!files) return []; if(Array.isArray(files)) return files.filter(Boolean); if(typeof files !== 'object') return []; return Object.keys(files).reduce(function(acc,key){ return acc.concat(Array.isArray(files[key]) ? files[key] : []); }, []).filter(Boolean); }
function posterUrl(files){ var poster = files.find(function(file){ var role = fileRoleKey(file); var mime = String(file.mime_type || '').toLowerCase(); return (role === 'poster' || role === 'cover' || role === 'image' || mime.indexOf('image/') === 0) && (file.thumbnail_url || file.file_url || file.url); }); return poster ? previewUrl(poster.thumbnail_url || poster.file_url || poster.url) : ''; }
function publicFile(files){ return files.find(function(file){ if(!file || !(file.file_url || file.url)) return false; var role = fileRoleKey(file); var mime = String(file.mime_type || '').toLowerCase(); if(role === 'poster' || role === 'cover' || role === 'image') return false; if(mime.indexOf('image/') === 0) return false; return true; }) || null; }
function fileRoleKey(file){ var raw = String(file.file_role_id || file.role_id || file.role || file.file_role_name || '').toLowerCase(); if(raw.indexOf('poster') >= 0) return 'poster'; if(raw.indexOf('cover') >= 0) return 'cover'; if(raw.indexOf('image') >= 0 || raw.indexOf('banner') >= 0) return 'image'; if(raw.indexOf('attach') >= 0 || raw.indexOf('pdf') >= 0 || raw.indexOf('document') >= 0) return 'attachment'; return raw; }
function previewUrl(url){ var u = String(url || '').trim(); var match = u.match(/\/file\/d\/([^/]+)/) || u.match(/[?&]id=([^&]+)/); return match && match[1] ? 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w1600' : u; }
function countryName(country, lang){ if(!country) return ''; if(typeof country === 'string') return cleanCountryName(country); var en = String(lang || currentLang).toUpperCase() === 'EN'; var name = en ? (country.country_name_en || country.country_name_th || country.country_id || '') : (country.country_name_th || country.country_name_en || country.country_id || ''); return cleanCountryName(name); }
function countryFlag(country){
  if(!country || typeof country !== 'object') return '';
  var flag = String(country.flag_emoji || '').trim();
  if(/\p{Regional_Indicator}/u.test(flag)) return flag;
  return flagEmojiFromCode(country.iso2 || country.country_id || '');
}
function flagEmojiFromCode(value){
  var code = String(value || '').toUpperCase().replace(/^CTRY-/, '').slice(0, 2);
  if(!/^[A-Z]{2}$/.test(code)) return '';
  return String.fromCodePoint(code.charCodeAt(0) + 127397, code.charCodeAt(1) + 127397);
}
function cleanCountryName(value){ return String(value || '').trim().replace(/^(CTRY-)?[A-Z]{2,3}\s*[-|:·]?\s+/i, '').trim(); }
function labelFunding(value){ var v = String(value || '').toLowerCase(); var th = {full:'ทุนเต็มจำนวน',partial:'ทุนบางส่วน',self:'ออกค่าใช้จ่ายเอง',both:'both'}; var en = {full:'Full funding',partial:'Partial funding',self:'Self-funded',both:'Both'}; return (currentLang === 'EN' ? en[v] : th[v]) || value; }
function labelTarget(value){ var v = String(value || '').toLowerCase(); var th = {student:'นิสิต',staff:'บุคลากร',both:'นิสิต/บุคลากร'}; var en = {student:'Students',staff:'Staff',both:'Students/Staff'}; return (currentLang === 'EN' ? en[v] : th[v]) || value; }
function formatDate(value){ if(!value) return ''; var d = new Date(value); if(Number.isNaN(d.getTime())) return ''; return d.toLocaleDateString(currentLang === 'EN' ? 'en-US' : 'th-TH', { day:'numeric', month:'short', year:'numeric' }); }
function setLang(lang){ currentLang = normalizeLang(lang); localStorage.setItem('iroup_public_lang', currentLang); applyLanguage(true); }
function applyLanguage(rerender){ document.documentElement.lang = currentLang === 'EN' ? 'en' : 'th'; document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); }); document.querySelectorAll('.lang-btn').forEach(function(btn){ btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang); }); applyTheme(); if(rerender && currentItem) renderDetail(); }
function toggleTheme(){ var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', next); localStorage.setItem('iroup_public_theme', next); applyTheme(); }
function applyTheme(){ var btn = document.getElementById('themeToggle'); if(btn) btn.textContent = document.documentElement.getAttribute('data-theme') === 'light' ? t('themeLight') : t('themeDark'); }
function normalizeLang(lang){ return String(lang || '').toUpperCase() === 'EN' ? 'EN' : 'TH'; }
function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.TH[key] || key; }
function esc(value){ return String(value == null ? '' : value).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
function escAttr(value){ return esc(value).replace(/`/g,'&#96;'); }
</script>
