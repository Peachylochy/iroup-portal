<style>
*{box-sizing:border-box}
:root{--blue:#1A6DB5;--sky:#4BBDE8;--navy:#0F2D5A;--dark:#071828;--green:#5BAD3E;--gold:#F5A623;--red:#D63B32;--purple:#7C3AED;--teal:#0D9488;--bg:#F5F8FC;--card:#fff;--line:#DCE7F2;--text:#10233f;--muted:#52647a;--soft:#E8F4FD;--shadow:0 9px 30px rgba(15,45,90,.12);--radius:18px}
body{margin:0;font-family:'Prompt',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit}
.app{min-height:100vh}
.sidebar{width:250px;min-width:250px;height:100vh;background:#fff;border-right:1px solid #E6EDF6;position:fixed;left:0;top:0;z-index:20;display:flex;flex-direction:column}
.brand{height:76px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid #E6EDF6}
.brand img{width:128px;max-width:100%;max-height:68px;height:auto;object-fit:contain}
.brand-title{font-size:12px;color:#66758a;line-height:1.25}.brand-title b{color:var(--navy);font-weight:900}
.nav{padding:16px 12px;overflow:auto;flex:1}.nav-section{font-size:11px;font-weight:800;color:#a0adbc;text-transform:uppercase;margin:18px 12px 8px}
.nav-link{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:#26364e;text-decoration:none;font-weight:800;font-size:14px;margin-bottom:4px}
.nav-link:hover{background:#F1F7FD;color:var(--blue)}.nav-link.active{background:var(--soft);color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.nav-icon{font-size:20px;width:24px;text-align:center}.userbox{margin-top:auto;padding:16px;border-top:1px solid #E6EDF6;display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--sky),var(--blue));display:grid;place-items:center;color:#fff;font-weight:900}
.user-name{font-size:12px;font-weight:900}.user-sub{font-size:11px;color:#66758a}
.main{margin-left:250px;min-height:100vh;padding:24px}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:18px}.title{font-size:28px;font-weight:900;color:var(--navy);line-height:1.1}.subtitle{font-size:13px;color:var(--muted);margin-top:4px}.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;min-height:42px}
.btn:hover{border-color:#BBD7EF;box-shadow:0 6px 16px rgba(15,45,90,.08)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{background:#fff;color:var(--red);border-color:#F5C4C0}.btn.ghost{background:transparent}
.lang-toggle,.view-toggle{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}.lang-toggle button,.view-toggle button{border:0;background:transparent;border-radius:9px;padding:7px 10px;font-weight:900;cursor:pointer;color:var(--muted)}.lang-toggle button.active,.view-toggle button.active{background:var(--blue);color:#fff}
.toolbar{display:grid;grid-template-columns:1.3fr .8fr .8fr .6fr auto;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:16px}
.input,.select,.textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;color:var(--text);outline:none}.textarea{min-height:98px;resize:vertical;font-family:'Sarabun',sans-serif}.input:focus,.select:focus,.textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,109,181,.12)}
.notice{display:none;margin-bottom:14px;padding:12px 14px;border-radius:14px;border:1px solid #BBD7EF;background:#F1F8FE;color:#174B7A;font-weight:700}.notice.error{background:#FFF5F4;border-color:#F5C4C0;color:#A62C25}.notice.ok{background:#F4FBF2;border-color:#C7E8BC;color:#356D27}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.event-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(15,45,90,.06);display:flex;flex-direction:column;gap:12px;min-height:230px}
.card-head{display:flex;gap:12px;align-items:flex-start}.type-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--blue);font-size:22px;flex:0 0 42px}.card-title{font-weight:900;line-height:1.35;font-size:16px}.card-sub{font-size:12px;color:var(--muted);margin-top:4px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta-item{font-size:12px;color:var(--muted);background:#F8FBFE;border:1px solid #EDF3F8;border-radius:12px;padding:8px}.meta-item b{display:block;color:var(--text);font-size:13px;margin-top:2px}
.badge-row{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;border:1px solid var(--line);background:#fff;color:var(--muted)}.badge.active{color:#207B32;background:#F2FBF0;border-color:#C7E8BC}.badge.draft{color:#875D00;background:#FFF8E8;border-color:#F8DB98}.badge.cancelled{color:#A62C25;background:#FFF4F3;border-color:#F5C4C0}.badge.pin{color:#6D43BA;background:#F6F0FF;border-color:#D8C8FF}.badge.mode{color:#174B7A;background:#F1F8FE;border-color:#BBD7EF}.badge.days-green{color:#207B32;background:#F2FBF0;border-color:#C7E8BC}.badge.days-yellow{color:#875D00;background:#FFF8E8;border-color:#F8DB98}.badge.days-red{color:#A62C25;background:#FFF4F3;border-color:#F5C4C0}.badge.done{color:#56657A;background:#F3F6FA;border-color:#D7E1EA}
.card-actions{margin-top:auto;display:flex;justify-content:flex-end;gap:8px}.empty{background:#fff;border:1px dashed #BFD0E0;border-radius:16px;padding:26px;text-align:center;color:var(--muted);font-weight:800;grid-column:1/-1}
.list-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto;box-shadow:0 6px 20px rgba(15,45,90,.06)}.event-table{width:100%;border-collapse:collapse;min-width:920px}.event-table th,.event-table td{padding:12px 14px;border-bottom:1px solid #EDF3F8;text-align:left;vertical-align:middle;font-size:13px}.event-table th{background:#F8FBFE;color:#344761;font-weight:900}.event-table tr:last-child td{border-bottom:0}.event-title-cell{font-weight:900;color:var(--navy)}
.table-pager{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 14px;border-top:1px solid #EDF3F8;background:#fff}.pager-btn{height:36px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#F8FBFE;color:var(--navy);font-weight:900;cursor:pointer}.pager-btn:disabled{opacity:.45;cursor:not-allowed}.pager-info{font-size:12px;color:var(--muted);font-weight:900}
.file-picker-row{display:flex;gap:10px;flex-wrap:wrap}.file-list{display:grid;gap:8px;margin-top:8px}.file-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:#F8FBFE;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:800;color:var(--muted)}.file-chip button{min-height:30px;padding:5px 9px}
.modal{display:none;position:fixed;inset:0;background:rgba(7,24,40,.46);z-index:100;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal-panel{width:min(1080px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(7,24,40,.28)}.modal-head{position:sticky;top:0;background:#fff;z-index:2;display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.modal-title{font-size:20px;font-weight:900;color:var(--navy)}.modal-body{padding:18px}.modal-foot{position:sticky;bottom:0;background:#fff;display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field.full{grid-column:1/-1}.label{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:900;color:#344761;margin-bottom:6px}.req{color:var(--red)}.hint{font-size:11px;color:var(--muted);font-weight:600}.checks{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-top:22px}.check{display:flex;align-items:center;gap:8px;font-weight:800}.check input{width:18px;height:18px}
.loading{display:grid;place-items:center;padding:36px;color:var(--muted);font-weight:800}.spinner{width:28px;height:28px;border:3px solid #D8E7F4;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:1fr 1fr}.toolbar .btn{justify-content:center}}
@media(max-width:900px){.sidebar{position:relative;width:100%;height:auto}.main{margin-left:0;padding:16px}.nav{display:flex;gap:6px;overflow-x:auto}.nav-section,.userbox{display:none}.nav-link{white-space:nowrap}.topbar{align-items:flex-start;flex-wrap:wrap}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}}

/* Events admin stabilization pass. CSS-only visual alignment with the newer admin shell. */
body{
  background:
    radial-gradient(80% 60% at 0% 0%, rgba(187,196,255,.42) 0%, transparent 60%),
    radial-gradient(60% 60% at 100% 0%, rgba(192,168,255,.32) 0%, transparent 65%),
    linear-gradient(135deg,#EEF2FF 0%,#E8F0FE 38%,#F1EAFB 100%);
  background-attachment:fixed;
}
body.modal-open{overflow:hidden}
.main{padding:28px 36px 40px}
.topbar{align-items:center;gap:14px;min-height:92px;overflow:visible;background:rgba(255,255,255,.66);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.72);border-radius:26px;box-shadow:0 20px 50px rgba(15,45,90,.12);padding:22px 24px;margin-bottom:22px}
.title{font-size:32px;line-height:1.08;letter-spacing:0;margin:0 0 6px;color:#0F2D5A}
.subtitle{font-size:15px;line-height:1.45;margin:0;color:#6B7F96}
.btn{border-color:#E6EDF6;border-radius:14px;background:rgba(255,255,255,.84);box-shadow:0 2px 10px rgba(15,45,90,.05);color:#26364E}
.btn:hover{border-color:#4BBDE8;box-shadow:0 10px 30px rgba(15,45,90,.08);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#1A6DB5,#0F4F8E);border-color:transparent;box-shadow:0 12px 28px rgba(26,109,181,.28)}
.btn.danger{background:#FFF7F6;border-color:#F5C4C0;color:#C2410C}
.lang-toggle,.view-toggle{background:rgba(255,255,255,.74);border-color:#E6EDF6;border-radius:16px;box-shadow:0 2px 10px rgba(15,45,90,.04)}
.lang-toggle button,.view-toggle button{border-radius:12px}
.lang-toggle button.active,.view-toggle button.active{background:linear-gradient(135deg,#1A6DB5,#0F4F8E);box-shadow:0 4px 10px rgba(26,109,181,.24)}
.toolbar{grid-template-columns:minmax(260px,1.6fr) repeat(3,minmax(130px,.7fr)) auto;background:rgba(255,255,255,.9);border-color:#E6EDF6;border-radius:22px;box-shadow:0 10px 30px rgba(15,45,90,.08);padding:14px 16px;margin-bottom:18px}
.input,.select,.textarea{border-color:#E6EDF6;background:#F8FBFE;border-radius:14px;min-height:44px;transition:border-color .15s,box-shadow .15s,background .15s;color:#10233f}
.input:hover,.select:hover,.textarea:hover{background:#fff}
.input:focus,.select:focus,.textarea:focus{border-color:#1A6DB5;background:#fff;box-shadow:0 0 0 4px rgba(26,109,181,.12)}
.notice{border-radius:18px;border-color:#BBD7EF;background:rgba(241,248,254,.92)}
.list-wrap,.event-card{background:rgba(255,255,255,.92);border-color:#E6EDF6;border-radius:22px;box-shadow:0 10px 30px rgba(15,45,90,.08)}
.event-table th{background:#FBFBFE;color:#6B7F96;text-transform:uppercase;font-size:12px;letter-spacing:.04em}.event-table td{border-bottom-color:#EEF2F8}.event-table tr:hover td{background:#F5FAFF}
.cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.event-card{padding:20px;transition:transform .2s,box-shadow .2s,border-color .2s}.event-card:hover{transform:translateY(-2px);border-color:#4BBDE8;box-shadow:0 20px 50px rgba(15,45,90,.12)}.card-title{color:#0F2D5A}.badge{border-color:#E6EDF6;background:#fff}
.table-pager{background:rgba(255,255,255,.92);border-top-color:#EEF2F8;border-radius:0 0 22px 22px}.cards .table-pager{border:1px solid #E6EDF6;border-radius:18px;box-shadow:0 10px 30px rgba(15,45,90,.08)}.pager-btn{border-color:#E6EDF6;border-radius:14px;background:#F5F8FC}
.modal{display:none;position:fixed;inset:0;width:100vw;height:100vh;z-index:120000;background:rgba(9,24,45,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:0;overflow:hidden}
.modal.open{display:block}
.modal-panel{position:fixed;left:50%;top:50%;width:min(1120px,calc(100vw - 96px));height:min(820px,calc(100vh - 112px));max-width:1120px;max-height:calc(100vh - 112px);margin:0;transform:translate(-50%,-50%);border:1px solid rgba(230,237,246,.92);border-radius:26px;box-shadow:0 34px 90px rgba(15,45,90,.34);overflow:hidden;display:flex;flex-direction:column;background:#fff}
.modal-panel form{height:100%;min-height:0;display:flex;flex-direction:column}
.modal-head{position:relative;top:auto;flex:0 0 auto;padding:22px 30px;background:rgba(255,255,255,.98);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.modal-title{font-size:24px;color:#0F2D5A}.modal-body{flex:1 1 auto;min-height:0;overflow:auto;padding:24px 30px;background:#FBFBFE}.modal-foot{position:relative;bottom:auto;flex:0 0 auto;padding:16px 30px;background:#fff}
.form-grid{gap:16px;grid-template-columns:repeat(2,minmax(260px,1fr))}.field,.input,.select,.textarea{min-width:0}.label{color:#52647a}
.modal .input,.modal .select,.modal .textarea{background:#F8FBFE !important;color:#10233f !important;border-color:#DCE7F2;box-shadow:inset 0 1px 0 rgba(255,255,255,.72);caret-color:#1A6DB5}
.modal .input:hover,.modal .select:hover,.modal .textarea:hover{background:#fff !important;border-color:#C8D9E8}
.modal .input:focus,.modal .select:focus,.modal .textarea:focus{background:#fff !important;border-color:#1A6DB5;box-shadow:0 0 0 4px rgba(26,109,181,.12)}
@media(max-width:1180px){.modal-panel{width:calc(100vw - 64px);height:calc(100vh - 96px);max-height:calc(100vh - 96px)}.form-grid{grid-template-columns:1fr}}
@media(max-width:900px){.main{padding:16px}.topbar{padding:18px}.modal-panel{width:calc(100vw - 24px);height:calc(100vh - 32px);max-height:calc(100vh - 32px);border-radius:18px}.modal-head,.modal-body,.modal-foot{padding-left:16px;padding-right:16px}}
</style>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="assets/IROUP_LOGO.webp" alt="iROUP">
    </div>
    <nav class="nav">
      <div class="nav-section">OVERVIEW</div>
      <a class="nav-link" href="dashboard.html"><span class="nav-icon">📊</span><span>Executive Dashboard</span></a>
      <div class="nav-section">MANAGEMENT</div>
      <a class="nav-link" href="mou.html"><span class="nav-icon">🤝</span><span>MOU</span></a>
      <a class="nav-link" href="mobility.html"><span class="nav-icon">🌏</span><span>Mobility</span></a>
      <a class="nav-link" href="travel.html"><span class="nav-icon">✈️</span><span>การเดินทาง</span></a>
      <a class="nav-link" href="scholarship.html"><span class="nav-icon">🎓</span><span>ทุนการศึกษา</span></a>
      <a class="nav-link active" href="events.html"><span class="nav-icon">📅</span><span>Events</span></a>
      <a class="nav-link" href="report.html"><span class="nav-icon">📤</span><span>รายงาน & Export</span></a>
      <div class="nav-section">PUBLIC</div>
      <a class="nav-link" href="public/public-landing.html"><span class="nav-icon">🌐</span><span>Public View</span></a>
    </nav>
    <div class="userbox">
      <div class="avatar">IR</div>
      <div><div class="user-name">งานวิเทศสัมพันธ์</div><div class="user-sub">University of Phayao</div></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="title" data-i18n-th="กิจกรรม" data-i18n-en="Events">กิจกรรม</div>
        <div class="subtitle" data-i18n-th="จัดการข้อมูลกิจกรรมด้วย V2 เป็นแหล่งข้อมูลหลัก" data-i18n-en="Manage event records with V2 as the source of truth">จัดการข้อมูลกิจกรรมด้วย V2 เป็นแหล่งข้อมูลหลัก</div>
      </div>
      <div class="spacer"></div>
      <div class="lang-toggle" aria-label="Language">
        <button type="button" id="langThBtn" class="active" onclick="setLang('th')">TH</button>
        <button type="button" id="langEnBtn" onclick="setLang('en')">EN</button>
      </div>
      <div class="view-toggle" aria-label="View mode">
        <button type="button" id="cardViewBtn" class="active" onclick="setViewMode('card')">Card</button>
        <button type="button" id="listViewBtn" onclick="setViewMode('list')">List</button>
      </div>
      <button class="btn" type="button" onclick="loadEvents(true)">↻ <span data-i18n-th="โหลดใหม่" data-i18n-en="Reload">โหลดใหม่</span></button>
      <button class="btn primary" type="button" onclick="openCreateModal()">+ <span data-i18n-th="เพิ่มกิจกรรม" data-i18n-en="Add Event">เพิ่มกิจกรรม</span></button>

    <section class="toolbar" aria-label="Event filters">

<div id="eventModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-panel">
    <form id="eventForm" onsubmit="saveEvent(event)">
      <div class="modal-head">
        <div>
          <div id="modalTitle" class="modal-title">เพิ่มกิจกรรม</div>
          <div id="modalSub" class="subtitle">V2-native EVENT metadata</div>
        </div>
        <div class="spacer"></div>
        <button class="btn" type="button" onclick="closeModal()">ปิด</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="eventId">
        <div class="form-grid">
          <div class="field">
            <label class="label" for="titleTh">ชื่อกิจกรรม (TH) <span class="req">*</span></label>
            <input id="titleTh" class="input" name="title_th" required>
          </div>
          <div class="field">
            <label class="label" for="titleEn">ชื่อกิจกรรม (EN) <span class="req">*</span></label>
            <input id="titleEn" class="input" name="title_en" required>
          </div>
          <div class="field">
            <label class="label" for="eventTypeSelect">ประเภทกิจกรรม <span class="req">*</span></label>
            <select id="eventTypeSelect" class="select" name="event_type_id" required onchange="updateEventTypeFields()"></select>
          </div>
          <div class="field" id="customEventTypeField" style="display:none">
            <label class="label" for="customEventType">ประเภทกิจกรรมใหม่ <span class="req">*</span></label>
            <input id="customEventType" class="input" name="event_type_custom" placeholder="เช่น ภาพยนตร์และวัฒนธรรม">
          </div>
          <div class="field">
            <label class="label" for="unitInput">หน่วยงาน <span class="req">*</span><span class="hint">พิมพ์เพื่อค้นหาได้</span></label>
            <input id="unitInput" class="input" list="unitOptions" name="organizer_unit_display" required>
            <datalist id="unitOptions"></datalist>
          </div>
          <div class="field">
            <label class="label" for="countryInput">ประเทศ <span class="hint">optional</span></label>
            <input id="countryInput" class="input" list="countryOptions" name="country_display">
            <datalist id="countryOptions"></datalist>
          </div>
          <div class="field">
            <label class="label" for="statusSelect">สถานะ</label>
            <select id="statusSelect" class="select" name="status">
              <option value="draft">draft</option>
              <option value="active">active</option>
              <option value="cancelled">cancelled</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="eventModeSelect">รูปแบบกิจกรรม</label>
            <select id="eventModeSelect" class="select" name="event_mode" onchange="updateEventModeFields()">
              <option value="offline">ออนไซต์</option>
              <option value="online">ออนไลน์</option>
              <option value="hybrid">ไฮบริด</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="startDate">วันที่เริ่ม <span class="req">*</span></label>
            <input id="startDate" class="input" type="date" name="start_date" required onchange="updateFiscalPreview()">
          </div>
          <div class="field">
            <label class="label" for="endDate">วันที่สิ้นสุด</label>
            <input id="endDate" class="input" type="date" name="end_date">
          </div>
          <div class="field">
            <label class="label" for="startTime">เวลาเริ่ม</label>
            <input id="startTime" class="input" type="time" name="start_time">
          </div>
          <div class="field">
            <label class="label" for="endTime">เวลาสิ้นสุด</label>
            <input id="endTime" class="input" type="time" name="end_time">
          </div>
          <div class="field" id="locationField">
            <label class="label" for="locationInput">สถานที่</label>
            <input id="locationInput" class="input" name="location">
          </div>
          <div class="field" id="meetingUrlField">
            <label class="label" for="meetingUrl">ลิงก์ online</label>
            <input id="meetingUrl" class="input" type="url" name="meeting_url">
          </div>
          <div class="field">
            <label class="label" for="participantCount">จำนวนผู้เข้าร่วม</label>
            <input id="participantCount" class="input" type="number" min="0" step="1" name="participant_count">
          </div>
          <div class="field">
            <label class="label">ปีงบประมาณ</label>
            <input id="fiscalPreview" class="input" readonly>
          </div>
          <div class="field full">
            <label class="label" for="detailTh">รายละเอียด (TH)</label>
            <textarea id="detailTh" class="textarea" name="detail_th"></textarea>
          </div>
          <div class="field full">
            <label class="label" for="detailEn">รายละเอียด (EN)</label>
            <textarea id="detailEn" class="textarea" name="detail_en"></textarea>
          </div>
          <div class="field">
            <label class="label" for="applyUrl">ลิงก์สมัคร</label>
            <input id="applyUrl" class="input" type="url" name="apply_url">
          </div>
          <div class="field">
            <label class="label" for="detailUrl">ลิงก์รายละเอียด</label>
            <input id="detailUrl" class="input" type="url" name="detail_url">
          </div>
          <div class="field">
            <label class="label" for="linkUrl">ลิงก์ไฟล์แนบ</label>
            <input id="linkUrl" class="input" type="url" name="link_url">
          </div>
          <div class="field full">
            <label class="label">ไฟล์กิจกรรม</label>
            <div class="file-picker-row">
              <button class="btn" type="button" onclick="chooseEventFile('attachment')">แนบไฟล์</button>
              <button class="btn" type="button" onclick="chooseEventFile('poster')">แนบรูปปก</button>
            </div>
            <input id="attachmentFileInput" type="file" hidden onchange="handleEventFileSelected(event, 'attachment')">
            <input id="posterFileInput" type="file" accept="image/*" hidden onchange="handleEventFileSelected(event, 'poster')">
            <div id="selectedFiles" class="file-list"></div>
          </div>
          <div class="field checks">
            <label class="check"><input id="publicVisible" type="checkbox" name="public_visible"> แสดงสาธารณะ</label>
            <label class="check"><input id="pinInput" type="checkbox" name="pin"> ปักหมุด</label>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button id="deleteBtn" class="btn danger" type="button" onclick="deleteEvent()">ลบ</button>
        <div class="spacer"></div>
        <button class="btn" type="button" onclick="closeModal()">ยกเลิก</button>
        <button id="saveBtn" class="btn primary" type="submit">บันทึก</button>
      </div>
    </form>
  </div>
</div>

<script>
const state = {
  lang: 'th',
  events: [],
  eventTypes: [],
  units: [],
  countries: [],
  editingId: '',
  viewMode: 'card',
  pendingFiles: [],
  loading: false,
  page: 1,
  pageSize: 10,
  lastFilterKey: ''
};

const $ = selector => document.querySelector(selector);

document.addEventListener('DOMContentLoaded', async () => {
  await loadMasters();
  await loadEvents(false);
});

async function loadMasters() {
  const [eventTypesRes, unitsRes, countriesRes] = await Promise.all([
    IROUP_V2.lookup.eventTypes(),
    IROUP_V2.lookup.units(),
    IROUP_V2.lookup.countries()
  ]);

  state.eventTypes = normalizeList(eventTypesRes);
  state.units = normalizeList(unitsRes);
  state.countries = normalizeList(countriesRes);

  populateMasterControls();
}

async function loadEvents(force) {
  if (state.loading) return;
  state.loading = true;
  showNotice('', '');
  $('#eventCards').innerHTML = '<div class="loading"><div><div class="spinner"></div>กำลังโหลดข้อมูล...</div></div>';
  try {
    const res = await IROUP_V2.admin.eventList({ includeArchived: true, _: force ? Date.now() : '' });
    if (!res.success) throw new Error(res.error || 'โหลดข้อมูลกิจกรรมไม่สำเร็จ');
    state.events = normalizeList(res).map(enrichEventForPage);
    populateYearFilter();
    renderEvents();
  } catch (error) {
    $('#eventCards').innerHTML = `<div class="empty">${esc(error.message || error)}</div>`;
    showNotice(error.message || String(error), 'error');
  } finally {
    state.loading = false;
  }
}

function normalizeList(res) {
  if (Array.isArray(res)) return res;
  if (Array.isArray(res?.data)) return res.data;
  if (Array.isArray(res?.data?.items)) return res.data.items;
  return [];
}

function populateMasterControls() {
  const typeOptions = state.eventTypes.map(type => {
    const label = typeLabel(type);
    return `<option value="${esc(type.event_type_id || '')}">${esc((type.icon ? type.icon + ' ' : '') + label)}</option>`;
  }).join('');
  $('#eventTypeSelect').innerHTML = '<option value="">เลือกประเภทกิจกรรม</option>' + typeOptions + '<option value="__custom__">➕ อื่น ๆ / ระบุเอง</option>';
  $('#typeFilter').innerHTML = '<option value="">ทุกประเภท</option>' + typeOptions;

  $('#unitOptions').innerHTML = state.units.map(unit => {
    const label = unitLabel(unit);
    return `<option value="${esc(label)}" data-id="${esc(unit.unit_id || '')}"></option>`;
  }).join('');

  $('#countryOptions').innerHTML = state.countries.map(country => {
    const label = countryLabel(country);
    return `<option value="${esc(label)}" data-id="${esc(country.country_id || '')}"></option>`;
  }).join('');
}

function populateYearFilter() {
  const selected = $('#yearFilter').value;
  const years = [...new Set(state.events.map(event => String(event.fiscal_year || fiscalYear(event.start_date) || '')).filter(Boolean))].sort((a, b) => b.localeCompare(a));
  $('#yearFilter').innerHTML = '<option value="">ทุกปี</option>' + years.map(year => `<option value="${esc(year)}">ปีงบ ${esc(year)}</option>`).join('');
  if (years.includes(selected)) $('#yearFilter').value = selected;
}

function renderEvents() {
  const q = $('#searchInput').value.trim().toLowerCase();
  const typeId = $('#typeFilter').value;
  const status = $('#statusFilter').value;
  const year = $('#yearFilter').value;
  const filterKey = [q, typeId, status, year, state.viewMode].join('|');
  if (filterKey !== state.lastFilterKey) {
    state.page = 1;
    state.lastFilterKey = filterKey;
  }
  const rows = state.events.filter(event => {
    const haystack = [
      event.title_th, event.title_en, event.event_type, event.event_type_id,
      unitDisplay(event), countryDisplay(event), event.location, event.detail_th, event.detail_en
    ].join(' ').toLowerCase();
    if (q && !haystack.includes(q)) return false;
    if (typeId && event.event_type_id !== typeId) return false;
    if (status && event.status !== status) return false;
    if (year && String(event.fiscal_year || fiscalYear(event.start_date)) !== year) return false;
    return true;
  });

  if (!rows.length) {
    $('#eventCards').className = 'cards';
    $('#eventCards').innerHTML = '<div class="empty">ไม่พบข้อมูลกิจกรรม</div>';
    return;
  }

  const maxPage = Math.max(1, Math.ceil(rows.length / state.pageSize));
  state.page = Math.min(Math.max(1, state.page), maxPage);
  const start = (state.page - 1) * state.pageSize;
  const pageRows = rows.slice(start, start + state.pageSize);

  if (state.viewMode === 'list') {
    $('#eventCards').className = 'list-wrap';
    $('#eventCards').innerHTML = renderList(pageRows, rows.length);
    return;
  }

  $('#eventCards').className = 'cards';
  $('#eventCards').innerHTML = pageRows.map(renderCard).join('') + renderPager(rows.length);
}

function renderCard(event) {
  const type = findEventType(event.event_type_id, event.event_type);
  const status = event.status || 'draft';
  const title = displayTitle(event);
  const detail = state.lang === 'en' ? event.detail_en || event.detail_th : event.detail_th || event.detail_en;
  const mode = eventModeBadge(event.event_mode);
  const days = daysBadge(event.start_date);
  return `
    <article class="event-card">
      <div class="card-head">
        <div class="type-icon" style="${type?.color_token ? `background:${esc(type.color_token)}1A;color:${esc(type.color_token)}` : ''}">${esc(type?.icon || '📅')}</div>
        <div>
          <div class="card-title">${esc(title || '-')}</div>
          <div class="card-sub">${esc(type ? typeLabel(type) : event.event_type || '-')}</div>
        </div>
      </div>
      <div class="badge-row">
        <span class="badge ${esc(status)}">${esc(status)}</span>
        <span class="badge mode">${esc(mode.label)}</span>
        <span class="badge ${esc(days.className)}">${esc(days.label)}</span>
        ${event.pin ? '<span class="badge pin">ปักหมุด</span>' : ''}
        ${event.public_visible ? '<span class="badge active">Public</span>' : ''}
      </div>
      <div class="meta">
        <div class="meta-item">วันที่เริ่ม<b>${esc(displayDate(event.start_date))}</b></div>
        <div class="meta-item">ปีงบประมาณ<b>${esc(event.fiscal_year || fiscalYear(event.start_date) || '-')}</b></div>
        <div class="meta-item">หน่วยงาน<b>${esc(unitDisplay(event) || '-')}</b></div>
        <div class="meta-item">ประเทศ<b>${esc(countryDisplay(event) || '-')}</b></div>
      </div>
      ${detail ? `<div class="card-sub">${esc(truncate(detail, 150))}</div>` : ''}
      <div class="card-actions">
        <button class="btn" type="button" onclick="openEditModal('${escAttr(event.event_id)}')">แก้ไข</button>
        <button class="btn danger" type="button" onclick="deleteV2Event('${escAttr(event.event_id)}')">ลบ</button>
      </div>
    </article>
  `;
}

function renderList(rows, totalRows) {
  const body = rows.map(event => {
    const type = findEventType(event.event_type_id, event.event_type);
    const status = event.status || 'draft';
    const mode = eventModeBadge(event.event_mode);
    return `
      <tr>
        <td class="event-title-cell">${esc(displayTitle(event) || '-')}</td>
        <td>${esc(type ? typeLabel(type) : event.event_type || '-')}</td>
        <td><span class="badge mode">${esc(mode.label)}</span></td>
        <td>${esc(displayDate(event.start_date))}</td>
        <td>${esc(unitDisplay(event) || '-')}</td>
        <td><span class="badge ${esc(status)}">${esc(status)}</span></td>
        <td>
          <button class="btn" type="button" onclick="openEditModal('${escAttr(event.event_id)}')">แก้ไข</button>
          <button class="btn danger" type="button" onclick="deleteV2Event('${escAttr(event.event_id)}')">ลบ</button>
        </td>
      </tr>
    `;
  }).join('');

  return `
    <table class="event-table">
      <thead>
        <tr>
          <th>ชื่อ</th>
          <th>ประเภท</th>
          <th>รูปแบบ</th>
          <th>วันที่</th>
          <th>หน่วยงาน</th>
          <th>สถานะ</th>
          <th>จัดการ</th>
        </tr>
      </thead>
      <tbody>${body}</tbody>
    </table>
    ${renderPager(totalRows)}
  `;
}

function renderPager(totalRows) {
  if (totalRows <= state.pageSize) return '';
  const maxPage = Math.max(1, Math.ceil(totalRows / state.pageSize));
  return `
    <div class="table-pager">
      <button class="pager-btn" type="button" onclick="changeEventPage(-1)" ${state.page <= 1 ? 'disabled' : ''}>Prev</button>
      <span class="pager-info">${esc(state.page)} / ${esc(maxPage)} · ${esc(totalRows)} records</span>
      <button class="pager-btn" type="button" onclick="changeEventPage(1)" ${state.page >= maxPage ? 'disabled' : ''}>Next</button>
    </div>
  `;
}

function changeEventPage(delta) {
  state.page = Math.max(1, state.page + delta);
  renderEvents();
}

function openCreateModal() {
  state.editingId = '';
  $('#eventForm').reset();
  state.pendingFiles = [];
  $('#eventId').value = '';
  $('#modalTitle').textContent = state.lang === 'en' ? 'Add Event' : 'เพิ่มกิจกรรม';
  $('#modalSub').textContent = 'V2-native EVENT metadata';
  $('#deleteBtn').style.display = 'none';
  $('#statusSelect').value = 'draft';
  $('#customEventType').value = '';
  $('#eventModeSelect').value = 'offline';
  updateFiscalPreview();
  updateEventTypeFields();
  updateEventModeFields();
  renderSelectedFiles();
  $('#eventModal').classList.add('open');
  document.body.classList.add('modal-open');
}

function openEditModal(eventId) {
  const event = state.events.find(item => item.event_id === eventId);
  if (!event) return;
  state.editingId = eventId;
  $('#eventForm').reset();
  state.pendingFiles = [];
  $('#eventId').value = event.event_id || '';
  $('#titleTh').value = event.title_th || '';
  $('#titleEn').value = event.title_en || '';
  if (event.event_type_id) {
    $('#eventTypeSelect').value = event.event_type_id;
    $('#customEventType').value = '';
  } else if (event.event_type) {
    $('#eventTypeSelect').value = '__custom__';
    $('#customEventType').value = event.event_type || '';
  } else {
    $('#eventTypeSelect').value = '';
    $('#customEventType').value = '';
  }
  $('#unitInput').value = unitDisplay(event) || '';
  $('#countryInput').value = countryDisplay(event) || '';
  $('#statusSelect').value = event.status || 'draft';
  $('#eventModeSelect').value = normalizeEventModeValue(event.event_mode);
  $('#startDate').value = event.start_date || '';
  $('#endDate').value = event.end_date || '';
  $('#startTime').value = event.start_time || '';
  $('#endTime').value = event.end_time || '';
  $('#locationInput').value = event.location || '';
  $('#meetingUrl').value = event.meeting_url || '';
  $('#participantCount').value = event.participant_count || '';
  $('#detailTh').value = event.detail_th || '';
  $('#detailEn').value = event.detail_en || '';
  $('#applyUrl').value = event.apply_url || '';
  $('#detailUrl').value = event.detail_url || '';
  $('#linkUrl').value = event.link_url || '';
  $('#publicVisible').checked = !!event.public_visible;
  $('#pinInput').checked = !!event.pin;
  $('#modalTitle').textContent = state.lang === 'en' ? 'Edit Event' : 'แก้ไขกิจกรรม';
  $('#modalSub').textContent = event.event_id || '';
  $('#deleteBtn').style.display = '';
  updateFiscalPreview();
  updateEventTypeFields();
  updateEventModeFields();
  renderSelectedFiles();
  $('#eventModal').classList.add('open');
  document.body.classList.add('modal-open');
}

function closeModal() {
  $('#eventModal').classList.remove('open');
  document.body.classList.remove('modal-open');
}

async function saveEvent(evt) {
  evt.preventDefault();
  const saveBtn = $('#saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'กำลังบันทึก...';
  try {
    const payload = buildPayloadFromForm();
    const isUpdate = !!payload.event_id;
    const res = isUpdate
      ? await IROUP_V2.admin.eventUpdate(payload)
      : await IROUP_V2.admin.eventCreate(payload);
    if (!res || !res.success) throw new Error(res?.error || 'บันทึกไม่สำเร็จ');
    const savedEventId = isUpdate ? payload.event_id : extractSavedEventId(res);
    if (state.pendingFiles.length) {
      await uploadPendingEventFiles(savedEventId);
    }
    alert('บันทึกสำเร็จ');
    closeModal();
    await loadEvents(true);
  } catch (error) {
    alert(error.message || String(error));
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'บันทึก';
  }
}

async function deleteEvent() {
  const eventId = $('#eventId').value;
  await deleteV2Event(eventId);
}

async function deleteV2Event(eventId) {
  if (!eventId) return;
  if (!confirm('ยืนยันลบกิจกรรมนี้หรือไม่')) return;
  if (!IROUP_V2.admin.eventDelete) {
    alert('ยังไม่มี V2 soft delete route สำหรับ EVENT');
    return;
  }
  const res = await IROUP_V2.admin.eventDelete(eventId);
  if (!res || !res.success) {
    alert(res?.error || 'ลบไม่สำเร็จ');
    return;
  }
  if ($('#eventModal').classList.contains('open') && $('#eventId').value === eventId) {
    closeModal();
  }
  await loadEvents(true);
}

function chooseEventFile(role) {
  const input = role === 'poster' ? $('#posterFileInput') : $('#attachmentFileInput');
  if (input) input.click();
}

function handleEventFileSelected(evt, role) {
  const file = evt && evt.target && evt.target.files ? evt.target.files[0] : null;
  if (!file) return;
  state.pendingFiles = state.pendingFiles.filter(item => role !== 'poster' || item.role !== 'poster');
  state.pendingFiles.push({
    role: role === 'poster' ? 'poster' : 'attachment',
    file: file
  });
  evt.target.value = '';
  renderSelectedFiles();
}

function renderSelectedFiles() {
  const box = $('#selectedFiles');
  if (!box) return;
  if (!state.pendingFiles.length) {
    box.innerHTML = '';
    return;
  }
  box.innerHTML = state.pendingFiles.map((item, index) => `
    <div class="file-chip">
      <span>${esc(item.role === 'poster' ? 'รูปปก' : 'ไฟล์แนบ')} · ${esc(item.file.name)}</span>
      <button class="btn" type="button" onclick="removeSelectedFile(${index})">ลบ</button>
    </div>
  `).join('');
}

function removeSelectedFile(index) {
  state.pendingFiles.splice(index, 1);
  renderSelectedFiles();
}

async function uploadPendingEventFiles(recordId) {
  if (!recordId) throw new Error('ไม่พบรหัสกิจกรรมสำหรับแนบไฟล์');
  const uploads = [];
  for (const item of state.pendingFiles) {
    const uploadFile = await prepareEventUploadFile(item);
    const dataUrl = await readFileAsDataUrl(uploadFile);
    const payload = {
      base64_data: dataUrl,
      filename: uploadFile.name,
      mime_type: uploadFile.type || 'application/octet-stream',
      module: 'event',
      record_id: recordId,
      file_role_id: item.role === 'poster' ? 'poster' : 'attachment',
      visibility_level: item.role === 'poster' ? 'public' : 'internal'
    };
    const res = await IROUP_V2.admin.fileUpload(payload);
    if (!res || !res.success) throw new Error(res?.error || 'อัปโหลดไฟล์ไม่สำเร็จ');
    uploads.push(res.data || {});
  }
  state.pendingFiles = [];
  renderSelectedFiles();
  return uploads;
}

async function prepareEventUploadFile(item) {
  const file = item && item.file ? item.file : null;
  if (!file || item.role !== 'poster' || typeof iroupOptimizeImageForUpload !== 'function') return file;
  const result = await iroupOptimizeImageForUpload(file, {
    maxWidth: 2000,
    maxHeight: 2000,
    quality: 0.9
  });
  if (result && result.optimized) {
    console.info('[event-upload] optimized poster image', {
      original_name: file.name,
      upload_name: result.file.name,
      original_kb: Math.round(result.originalSize / 1024),
      upload_kb: Math.round(result.optimizedSize / 1024),
      original_size: result.originalWidth + 'x' + result.originalHeight,
      upload_size: result.width + 'x' + result.height
    });
  }
  return result && result.file ? result.file : file;
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(reader.error || new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.readAsDataURL(file);
  });
}

function extractSavedEventId(res) {
  const data = res && res.data ? res.data : {};
  return data.event?.event_id || data.persisted_event?.event_id || data.event_id || '';
}

function buildPayloadFromForm() {
  const selectedTypeId = $('#eventTypeSelect').value.trim();
  const isCustomType = selectedTypeId === '__custom__';
  const type = isCustomType ? null : findEventType(selectedTypeId, '');
  const customEventType = $('#customEventType').value.trim();
  const unit = findUnitByLabel($('#unitInput').value);
  const country = findCountryByLabel($('#countryInput').value);
  const payload = {
    event_id: $('#eventId').value.trim(),
    title_th: $('#titleTh').value.trim(),
    title_en: $('#titleEn').value.trim(),
    event_type_id: isCustomType ? '' : selectedTypeId,
    event_type: isCustomType ? customEventType : (typeLabel(type) || selectedTypeId),
    event_mode: normalizeEventModeValue($('#eventModeSelect').value),
    organizer_unit_id: unit?.unit_id || '',
    organizer: $('#unitInput').value.trim(),
    country_id: country?.country_id || '',
    country: $('#countryInput').value.trim(),
    start_date: $('#startDate').value,
    end_date: $('#endDate').value || $('#startDate').value,
    start_time: $('#startTime').value,
    end_time: $('#endTime').value,
    location: $('#locationInput').value.trim(),
    meeting_url: $('#meetingUrl').value.trim(),
    participant_count: Number($('#participantCount').value || 0),
    detail_th: $('#detailTh').value.trim(),
    detail_en: $('#detailEn').value.trim(),
    apply_url: $('#applyUrl').value.trim(),
    detail_url: $('#detailUrl').value.trim(),
    link_url: $('#linkUrl').value.trim() || $('#detailUrl').value.trim() || $('#applyUrl').value.trim(),
    status: $('#statusSelect').value,
    public_visible: $('#publicVisible').checked,
    pin: $('#pinInput').checked
  };
  validatePayload(payload);
  return payload;
}

function validatePayload(payload) {
  const missing = [];
  if (!payload.title_th) missing.push('ชื่อกิจกรรม (TH)');
  if (!payload.title_en) missing.push('ชื่อกิจกรรม (EN)');
  if (!payload.event_type_id && !payload.event_type) missing.push('ประเภทกิจกรรม');
  if (!payload.organizer_unit_id && !payload.organizer) missing.push('หน่วยงาน');
  if (!payload.start_date) missing.push('วันที่เริ่ม');
  if (payload.end_date && payload.start_date && payload.end_date < payload.start_date) missing.push('วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่ม');
  if (missing.length) throw new Error('กรุณากรอกข้อมูลให้ครบ: ' + missing.join(', '));
}

function enrichEventForPage(event) {
  const row = Object.assign({}, event || {});
  const type = findEventType('', row.event_type);
  row.event_type_id = row.event_type_id || type?.event_type_id || '';
  row.fiscal_year = row.fiscal_year || fiscalYear(row.start_date);
  row.apply_url = row.apply_url || '';
  row.detail_url = row.detail_url || '';
  return row;
}

function findEventType(id, display) {
  const wantedId = String(id || '').trim();
  if (wantedId) {
    const byId = state.eventTypes.find(type => type.event_type_id === wantedId);
    if (byId) return byId;
  }
  const wanted = String(display || '').trim().toLowerCase();
  if (!wanted) return null;
  return state.eventTypes.find(type => [type.name_th, type.name_en, type.event_type_id].map(value => String(value || '').trim().toLowerCase()).includes(wanted)) || null;
}

function findUnitByLabel(value) {
  const wanted = String(value || '').trim().toLowerCase();
  return state.units.find(unit => [unit.unit_id, unit.unit_code, unit.unit_name_th, unit.unit_name_en, unitLabel(unit)].map(item => String(item || '').trim().toLowerCase()).includes(wanted)) || null;
}

function findCountryByLabel(value) {
  const wanted = String(value || '').trim().toLowerCase();
  return state.countries.find(country => [country.country_id, country.iso2, country.iso3, country.country_name_th, country.country_name_en, countryLabel(country)].map(item => String(item || '').trim().toLowerCase()).includes(wanted)) || null;
}

function displayTitle(event) {
  return state.lang === 'en' ? event.title_en || event.title_th : event.title_th || event.title_en;
}

function typeLabel(type) {
  if (!type) return '';
  return state.lang === 'en' ? type.name_en || type.name_th || type.event_type_id : type.name_th || type.name_en || type.event_type_id;
}

function unitLabel(unit) {
  if (!unit) return '';
  return state.lang === 'en' ? unit.unit_name_en || unit.unit_name_th || unit.unit_code || unit.unit_id : unit.unit_name_th || unit.unit_name_en || unit.unit_code || unit.unit_id;
}

function countryLabel(country) {
  if (!country) return '';
  const name = state.lang === 'en' ? country.country_name_en || country.country_name_th : country.country_name_th || country.country_name_en;
  return [country.flag_emoji, name || country.iso3 || country.country_id].filter(Boolean).join(' ');
}

function unitDisplay(event) {
  if (event.organizer_unit) return unitLabel(event.organizer_unit);
  return event.organizer || event.organizer_display || '';
}

function countryDisplay(event) {
  if (event.country) return countryLabel(event.country);
  return event.country_display || '';
}

function eventModeBadge(mode) {
  const normalized = normalizeEventModeValue(mode);
  if (normalized === 'online') return { value: 'online', label: '💻 ออนไลน์' };
  if (normalized === 'hybrid') return { value: 'hybrid', label: '🔀 ไฮบริด' };
  return { value: 'offline', label: '🏢 ออนไซต์' };
}

function normalizeEventModeValue(mode) {
  const normalized = String(mode || 'offline').trim().toLowerCase();
  if (normalized === 'onsite' || normalized === 'on-site' || normalized === 'in_person' || normalized === 'in-person') return 'offline';
  if (normalized === 'online') return 'online';
  if (normalized === 'hybrid') return 'hybrid';
  return 'offline';
}

function updateEventTypeFields() {
  const select = $('#eventTypeSelect');
  const field = $('#customEventTypeField');
  const input = $('#customEventType');
  const isCustom = select && select.value === '__custom__';
  if (field) field.style.display = isCustom ? '' : 'none';
  if (input) {
    input.required = !!isCustom;
    if (!isCustom) input.value = '';
  }
}

function daysBadge(dateText) {
  const parts = String(dateText || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!parts) return { label: '-', className: 'done' };
  const today = new Date();
  const start = new Date(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3]));
  today.setHours(0, 0, 0, 0);
  start.setHours(0, 0, 0, 0);
  const days = Math.ceil((start.getTime() - today.getTime()) / 86400000);
  if (days < 0) return { label: 'เสร็จสิ้น', className: 'done' };
  if (days > 30) return { label: `เหลืออีก ${days} วัน`, className: 'days-green' };
  if (days >= 7) return { label: `เหลืออีก ${days} วัน`, className: 'days-yellow' };
  return { label: `เหลืออีก ${days} วัน`, className: 'days-red' };
}

function fiscalYear(dateText) {
  if (!dateText) return '';
  const parts = String(dateText).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!parts) return '';
  const year = Number(parts[1]) + 543;
  const month = Number(parts[2]);
  return String(month >= 10 ? year + 1 : year);
}

function displayDate(dateText) {
  if (!dateText) return '-';
  const parts = String(dateText).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!parts) return dateText;
  const date = new Date(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3]));
  if (state.lang === 'en') return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  return date.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
}

function updateFiscalPreview() {
  const fy = fiscalYear($('#startDate').value);
  $('#fiscalPreview').value = fy ? `ปีงบประมาณ ${fy}` : '';
}

function updateEventModeFields() {
  const mode = normalizeEventModeValue($('#eventModeSelect') ? $('#eventModeSelect').value : 'offline');
  const showLocation = mode === 'offline' || mode === 'hybrid';
  const showMeetingUrl = mode === 'online' || mode === 'hybrid';
  const locationField = $('#locationField');
  const meetingUrlField = $('#meetingUrlField');
  if (locationField) locationField.style.display = showLocation ? '' : 'none';
  if (meetingUrlField) meetingUrlField.style.display = showMeetingUrl ? '' : 'none';
}

function setLang(lang) {
  state.lang = lang === 'en' ? 'en' : 'th';
  $('#langThBtn').classList.toggle('active', state.lang === 'th');
  $('#langEnBtn').classList.toggle('active', state.lang === 'en');
  document.querySelectorAll('[data-i18n-th]').forEach(node => {
    node.textContent = node.getAttribute(state.lang === 'en' ? 'data-i18n-en' : 'data-i18n-th');
  });
  populateMasterControls();
  renderEvents();
}

function setViewMode(mode) {
  state.viewMode = mode === 'list' ? 'list' : 'card';
  $('#cardViewBtn').classList.toggle('active', state.viewMode === 'card');
  $('#listViewBtn').classList.toggle('active', state.viewMode === 'list');
  renderEvents();
}

function clearFilters() {
  $('#searchInput').value = '';
  $('#typeFilter').value = '';
  $('#statusFilter').value = '';
  $('#yearFilter').value = '';
  renderEvents();
}

function showNotice(message, type) {
  const box = $('#notice');
  if (!message) {
    box.style.display = 'none';
    box.textContent = '';
    box.className = 'notice';
    return;
  }
  box.textContent = message;
  box.className = 'notice ' + (type || '');
  box.style.display = 'block';
}

function truncate(text, max) {
  const value = String(text || '');
  return value.length > max ? value.slice(0, max - 1) + '…' : value;
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
}

function escAttr(value) {
  return esc(value).replace(/`/g, '&#96;');
}
</script>
